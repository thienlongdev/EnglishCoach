<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniVoice Local TTS Playground</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-border: #334155;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #818cf8;
      --success: #34d399;
      --card-bg: rgba(30, 41, 59, 0.75);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #0f172a 70%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 1rem;
    }
    .container {
      width: 100%;
      max-width: 680px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--surface-border);
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    .header {
      margin-bottom: 1.5rem;
      border-bottom: 1px solid var(--surface-border);
      padding-bottom: 1rem;
    }
    .badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      background: rgba(56, 189, 248, 0.15);
      color: var(--primary);
      padding: 0.25rem 0.6rem;
      border-radius: 9999px;
      margin-bottom: 0.5rem;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    p.subtitle {
      color: var(--text-muted);
      font-size: 0.875rem;
      margin-top: 0.25rem;
    }
    .form-group {
      margin-bottom: 1.25rem;
    }
    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: #e2e8f0;
    }
    textarea {
      width: 100%;
      min-height: 110px;
      background: #090d16;
      border: 1px solid var(--surface-border);
      border-radius: 10px;
      color: var(--text);
      padding: 0.85rem;
      font-size: 0.95rem;
      line-height: 1.5;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s;
    }
    textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
    }
    .voice-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.65rem;
    }
    .voice-card {
      background: #0b1120;
      border: 1px solid var(--surface-border);
      border-radius: 10px;
      padding: 0.75rem 1rem;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      transition: all 0.2s;
      position: relative;
    }
    .voice-card:hover {
      border-color: #475569;
      background: #131d31;
    }
    .voice-card.selected {
      border-color: var(--primary);
      background: rgba(56, 189, 248, 0.08);
      box-shadow: 0 0 0 1px var(--primary);
    }
    .voice-card input {
      display: none;
    }
    .voice-name {
      font-size: 0.95rem;
      font-weight: 600;
      color: #f1f5f9;
    }
    .voice-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
    }
    .btn-submit {
      width: 100%;
      margin-top: 1rem;
      padding: 0.85rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
      color: #0b1120;
      border: none;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
    .btn-submit:hover:not(:disabled) {
      opacity: 0.95;
      transform: translateY(-1px);
    }
    .btn-submit:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .results-card {
      margin-top: 1.5rem;
      border-top: 1px solid var(--surface-border);
      padding-top: 1.25rem;
      display: none;
    }
    .latency-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(52, 211, 153, 0.15);
      color: var(--success);
      border: 1px solid rgba(52, 211, 153, 0.3);
      padding: 0.35rem 0.8rem;
      border-radius: 9999px;
      font-size: 0.825rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }
    audio {
      width: 100%;
      border-radius: 8px;
      outline: none;
    }
    .error-msg {
      margin-top: 1rem;
      color: #f87171;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 0.75rem;
      border-radius: 8px;
      font-size: 0.875rem;
      display: none;
    }
    .spinner {
      border: 2px solid rgba(0,0,0,0.2);
      border-left-color: #000;
      border-radius: 50%;
      width: 16px;
      height: 16px;
      animation: spin 0.8s linear infinite;
      display: none;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <span class="badge">Local AI Inference</span>
      <h1>OmniVoice TTS Playground</h1>
      <p class="subtitle">Zero-shot reference-voice synthesis on local Windows GPU</p>
    </div>

    <div class="form-group">
      <label for="text-input">Text</label>
      <textarea id="text-input" placeholder="Enter English text to synthesize...">Hey, it's great to see you again. How have you been lately? I was wondering if you'd like to grab a coffee sometime.</textarea>
    </div>

    <div class="form-group">
      <label>Voice</label>
      <div class="voice-grid">
        <label class="voice-card selected" onclick="selectVoice('us_male', this)">
          <input type="radio" name="voiceId" value="us_male" checked>
          <span class="voice-name">US Male</span>
          <span class="voice-meta">American Male</span>
        </label>
        <label class="voice-card" onclick="selectVoice('us_female', this)">
          <input type="radio" name="voiceId" value="us_female">
          <span class="voice-name">US Female</span>
          <span class="voice-meta">American Female</span>
        </label>
        <label class="voice-card" onclick="selectVoice('uk_male', this)">
          <input type="radio" name="voiceId" value="uk_male">
          <span class="voice-name">UK Male</span>
          <span class="voice-meta">British Male</span>
        </label>
        <label class="voice-card" onclick="selectVoice('uk_female', this)">
          <input type="radio" name="voiceId" value="uk_female">
          <span class="voice-name">UK Female</span>
          <span class="voice-meta">British Female</span>
        </label>
      </div>
    </div>

    <button id="btn-generate" class="btn-submit" onclick="generateSpeech()">
      <span class="spinner" id="spinner"></span>
      <span id="btn-text">Generate Speech</span>
    </button>

    <div class="error-msg" id="error-box"></div>

    <div class="results-card" id="results-card">
      <div class="latency-pill" id="latency-display">Latency: --</div>
      <audio id="audio-player" controls preload="auto"></audio>
    </div>
  </div>

  <script>
    let selectedVoiceId = 'us_male';
    const API_BASE = window.location.origin.includes('8005') || window.location.origin.includes('8000') 
      ? window.location.origin 
      : 'http://127.0.0.1:8005';

    function selectVoice(voiceId, el) {
      selectedVoiceId = voiceId;
      document.querySelectorAll('.voice-card').forEach(c => c.classList.remove('selected'));
      el.classList.add('selected');
      const radio = el.querySelector('input');
      if (radio) radio.checked = true;
    }

    async function generateSpeech() {
      const text = document.getElementById('text-input').value.trim();
      const errorBox = document.getElementById('error-box');
      const resultsCard = document.getElementById('results-card');
      const btn = document.getElementById('btn-generate');
      const spinner = document.getElementById('spinner');
      const btnText = document.getElementById('btn-text');
      const audioPlayer = document.getElementById('audio-player');
      const latencyDisplay = document.getElementById('latency-display');

      errorBox.style.display = 'none';
      errorBox.textContent = '';

      if (!text) {
        errorBox.textContent = 'Please enter non-empty text to synthesize.';
        errorBox.style.display = 'block';
        return;
      }

      btn.disabled = true;
      spinner.style.display = 'inline-block';
      btnText.textContent = 'Synthesizing with OmniVoice...';

      const tStart = performance.now();

      try {
        const resp = await fetch(`${API_BASE}/tts/omnivoice`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: text, voiceId: selectedVoiceId })
        });

        if (!resp.ok) {
          const errData = await resp.json().catch(() => ({ detail: resp.statusText }));
          throw new Error(errData.detail || 'Synthesis failed');
        }

        const latencyHeader = resp.headers.get('X-Synthesis-Latency');
        const durationHeader = resp.headers.get('X-Audio-Duration');
        const clientLatency = ((performance.now() - tStart) / 1000).toFixed(2);

        const blob = await resp.blob();
        const audioUrl = URL.createObjectURL(blob);
        audioPlayer.src = audioUrl;

        let metaText = `Synthesis latency: ${latencyHeader ? latencyHeader + 's' : clientLatency + 's'}`;
        if (durationHeader) {
          metaText += ` | Audio: ${durationHeader}s`;
        }
        latencyDisplay.textContent = metaText;

        resultsCard.style.display = 'block';
        audioPlayer.play().catch(() => {});
      } catch (err) {
        errorBox.textContent = err.message || 'Error communicating with OmniVoice endpoint.';
        errorBox.style.display = 'block';
      } finally {
        btn.disabled = false;
        spinner.style.display = 'none';
        btnText.textContent = 'Generate Speech';
      }
    }
  </script>
</body>
</html>
