<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect x="0" y="0" width="600" height="400" fill="#f8fafc"/>
  <!-- Wall shelf units -->
  <rect x="50" y="60" width="500" height="18" fill="#64748b" rx="3"/>
  <rect x="50" y="200" width="500" height="22" fill="#475569" rx="3"/>
  <rect x="50" y="350" width="500" height="22" fill="#334155" rx="3"/>
  
  <!-- Binders on top shelf -->
  <rect x="90" y="90" width="22" height="110" fill="#ef4444" rx="2"/>
  <rect x="114" y="90" width="22" height="110" fill="#3b82f6" rx="2"/>
  <rect x="138" y="90" width="22" height="110" fill="#10b981" rx="2"/>
  <rect x="162" y="90" width="22" height="110" fill="#f59e0b" rx="2"/>
  <rect x="186" y="90" width="22" height="110" fill="#6366f1" rx="2"/>

  <!-- Scanner on middle shelf -->
  <rect x="260" y="140" width="230" height="60" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="265,140 485,140 470,105 280,105" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/>
  <!-- Scanner glass / indicator light -->
  <circle cx="460" cy="165" r="5" fill="#22c55e"/>
  <rect x="290" y="160" width="140" height="20" rx="4" fill="#0f172a"/>
  <text x="360" y="174" fill="#38bdf8" font-family="monospace" font-size="10" text-anchor="middle">READY TO SCAN</text>

  <!-- Word prompts badges overlay at bottom -->
  <rect x="160" y="310" width="120" height="30" rx="6" fill="#1e293b"/>
  <text x="220" y="330" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">scanner</text>
  <rect x="320" y="310" width="120" height="30" rx="6" fill="#1e293b"/>
  <text x="380" y="330" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">shelf</text>
</svg>