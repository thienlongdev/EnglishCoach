<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect x="0" y="0" width="600" height="400" fill="#f1f5f9"/>
  <!-- Desk surface -->
  <rect x="40" y="40" width="520" height="320" rx="16" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="4"/>
  
  <!-- Agreement Paper Document -->
  <rect x="140" y="70" width="320" height="260" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="300" y="110" fill="#0f172a" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">CONSULTING AGREEMENT</text>
  <line x1="180" y1="135" x2="420" y2="135" stroke="#cbd5e1" stroke-width="4"/>
  <line x1="180" y1="155" x2="420" y2="155" stroke="#cbd5e1" stroke-width="4"/>
  <line x1="180" y1="175" x2="380" y2="175" stroke="#cbd5e1" stroke-width="4"/>
  <line x1="180" y1="195" x2="420" y2="195" stroke="#cbd5e1" stroke-width="4"/>
  
  <!-- Signature Line -->
  <line x1="180" y1="270" x2="330" y2="270" stroke="#0f172a" stroke-width="2"/>
  <path d="M 190 265 Q 210 240 230 260 T 270 250 T 310 265" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <text x="180" y="290" fill="#64748b" font-family="sans-serif" font-size="11">Authorized Signature</text>

  <!-- Luxury Fountain Pen -->
  <polygon points="360,250 480,150 490,160 370,260" fill="#1e293b"/>
  <polygon points="350,260 360,250 370,260" fill="#eab308"/>
  <circle cx="348" cy="262" r="2" fill="#0f172a"/>

  <!-- Words Overlay -->
  <rect x="160" y="340" width="130" height="30" rx="6" fill="#1e293b"/>
  <text x="225" y="360" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">agreement</text>
  <rect x="310" y="340" width="130" height="30" rx="6" fill="#1e293b"/>
  <text x="375" y="360" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">sign</text>
</svg>