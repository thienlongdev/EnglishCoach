<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <rect width="600" height="400" fill="#e9ecef"/>
  <!-- Warehouse Floor and Wall -->
  <rect x="0" y="0" width="600" height="250" fill="#ced4da"/>
  <rect x="0" y="250" width="600" height="150" fill="#adb5bd"/>
  <line x1="0" y1="250" x2="600" y2="250" stroke="#6c757d" stroke-width="3"/>
  <!-- Industrial Storage Racks -->
  <rect x="40" y="40" width="20" height="260" fill="#0056b3"/>
  <rect x="180" y="40" width="20" height="260" fill="#0056b3"/>
  <line x1="40" y1="100" x2="180" y2="100" stroke="#ffc107" stroke-width="6"/>
  <line x1="40" y1="180" x2="180" y2="180" stroke="#ffc107" stroke-width="6"/>
  <line x1="40" y1="240" x2="180" y2="240" stroke="#ffc107" stroke-width="6"/>
  <!-- Pallets on racks -->
  <rect x="65" y="70" width="90" height="30" fill="#8d6e63" stroke="#5d4037" stroke-width="2"/>
  <rect x="65" y="150" width="90" height="30" fill="#8d6e63" stroke="#5d4037" stroke-width="2"/>
  <!-- Forklift Machine -->
  <rect x="320" y="220" width="140" height="80" fill="#ff9800" rx="8"/>
  <rect x="340" y="160" width="80" height="60" fill="#37474f" rx="4"/>
  <rect x="350" y="170" width="60" height="45" fill="#cfd8dc"/>
  <!-- Forklift wheels -->
  <circle cx="340" cy="300" r="22" fill="#212121"/>
  <circle cx="430" cy="300" r="22" fill="#212121"/>
  <!-- Forklift mast and forks -->
  <rect x="460" y="140" width="12" height="150" fill="#424242"/>
  <rect x="472" y="270" width="60" height="10" fill="#424242"/>
  <!-- Pallet on forks -->
  <rect x="480" y="235" width="50" height="35" fill="#8d6e63"/>
</svg>