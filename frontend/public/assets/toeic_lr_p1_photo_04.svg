<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <rect width="600" height="400" fill="#f1f3f5"/>
  <!-- Terminal Windows -->
  <rect x="40" y="20" width="520" height="180" fill="#bbdefb" stroke="#64b5f6" stroke-width="4"/>
  <line x1="170" y1="20" x2="170" y2="200" stroke="#64b5f6" stroke-width="3"/>
  <line x1="300" y1="20" x2="300" y2="200" stroke="#64b5f6" stroke-width="3"/>
  <line x1="430" y1="20" x2="430" y2="200" stroke="#64b5f6" stroke-width="3"/>
  <!-- Aircraft silhouette outside -->
  <polygon points="320,80 400,95 440,75 435,100 380,105 320,80" fill="#90caf9"/>
  <!-- Departure Gate Sign -->
  <rect x="220" y="15" width="160" height="40" fill="#1565c0" rx="4"/>
  <text x="300" y="38" font-family="Arial" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">GATE 14B</text>
  <!-- Waiting Area Seats -->
  <rect x="60" y="260" width="480" height="25" fill="#455a64" rx="4"/>
  <rect x="80" y="220" width="60" height="40" fill="#78909c" rx="4"/>
  <rect x="160" y="220" width="60" height="40" fill="#78909c" rx="4"/>
  <rect x="240" y="220" width="60" height="40" fill="#78909c" rx="4"/>
  <rect x="320" y="220" width="60" height="40" fill="#78909c" rx="4"/>
  <rect x="400" y="220" width="60" height="40" fill="#78909c" rx="4"/>
  <!-- Passenger figures -->
  <circle cx="190" cy="205" r="14" fill="#37474f"/>
  <path d="M 175 220 L 205 220 L 200 250 L 180 250 Z" fill="#546e7a"/>
  <!-- Luggage bag -->
  <rect x="145" y="250" width="25" height="35" fill="#d32f2f" rx="3"/>
</svg>