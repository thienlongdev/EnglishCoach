<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <rect width="600" height="400" fill="#f5f5f5"/>
  <!-- Hallway Perspective -->
  <polygon points="0,0 200,120 200,280 0,400" fill="#e0e0e0"/>
  <polygon points="600,0 400,120 400,280 600,400" fill="#eeeeee"/>
  <polygon points="200,120 400,120 400,280 200,280" fill="#bdbdbd"/>
  <!-- Ceiling Lights -->
  <rect x="270" y="20" width="60" height="15" fill="#fffde7" stroke="#fff59d"/>
  <rect x="280" y="60" width="40" height="10" fill="#fffde7" stroke="#fff59d"/>
  <!-- Doors on Left Wall -->
  <polygon points="30,80 110,130 110,310 30,360" fill="#5d4037"/>
  <!-- Office Worker in Hallway -->
  <circle cx="300" cy="180" r="16" fill="#37474f"/>
  <path d="M 285 200 L 315 200 L 320 270 L 280 270 Z" fill="#1e88e5"/>
  <!-- Carrying Folders / Box -->
  <rect x="288" y="220" width="28" height="20" fill="#fb8c00" stroke="#e65100" stroke-width="1.5"/>
  <!-- Floor tiles line -->
  <line x1="200" y1="280" x2="0" y2="400" stroke="#9e9e9e" stroke-width="2"/>
  <line x1="400" y1="280" x2="600" y2="400" stroke="#9e9e9e" stroke-width="2"/>
</svg>