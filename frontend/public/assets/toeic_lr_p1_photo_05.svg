<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <rect width="600" height="400" fill="#e8f5e9"/>
  <!-- Cafe Exterior Building -->
  <rect x="0" y="0" width="600" height="200" fill="#d7ccc8"/>
  <rect x="60" y="40" width="140" height="120" fill="#80deea" stroke="#00838f" stroke-width="4"/>
  <rect x="240" y="40" width="100" height="160" fill="#5d4037"/>
  <rect x="380" y="40" width="140" height="120" fill="#80deea" stroke="#00838f" stroke-width="4"/>
  <!-- Cafe Awning / Umbrella -->
  <polygon points="120,240 60,180 180,180" fill="#e53935"/>
  <line x1="120" y1="180" x2="120" y2="280" stroke="#424242" stroke-width="4"/>
  <polygon points="460,240 400,180 520,180" fill="#e53935"/>
  <line x1="460" y1="180" x2="460" y2="280" stroke="#424242" stroke-width="4"/>
  <!-- Outdoor Terrace Tables & Chairs -->
  <circle cx="120" cy="280" r="30" fill="#ffffff" stroke="#9e9e9e" stroke-width="2"/>
  <circle cx="80" cy="280" r="12" fill="#8d6e63"/>
  <circle cx="160" cy="280" r="12" fill="#8d6e63"/>
  <circle cx="460" cy="280" r="30" fill="#ffffff" stroke="#9e9e9e" stroke-width="2"/>
  <circle cx="420" cy="280" r="12" fill="#8d6e63"/>
  <circle cx="500" cy="280" r="12" fill="#8d6e63"/>
  <!-- Potted plants -->
  <rect x="260" y="240" width="25" height="30" fill="#bf360c" rx="2"/>
  <circle cx="272" cy="235" r="16" fill="#43a047"/>
</svg>