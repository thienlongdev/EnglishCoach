<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <!-- Sky & Ground -->
  <rect x="0" y="0" width="800" height="280" fill="#bae6fd"/>
  <rect x="0" y="280" width="800" height="220" fill="#d6d3d1"/>
  
  <!-- Market Awning -->
  <polygon points="100,50 700,50 740,120 60,120" fill="#16a34a"/>
  <path d="M 60 120 Q 90 145 120 120 Q 150 145 180 120 Q 210 145 240 120 Q 270 145 300 120 Q 330 145 360 120 Q 390 145 420 120 Q 450 145 480 120 Q 510 145 540 120 Q 570 145 600 120 Q 630 145 660 120 Q 690 145 720 120 Q 750 145 740 120 Z" fill="#ffffff"/>
  <line x1="120" y1="120" x2="120" y2="420" stroke="#78716c" stroke-width="10"/>
  <line x1="680" y1="120" x2="680" y2="420" stroke="#78716c" stroke-width="10"/>
  <text x="400" y="95" fill="#ffffff" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" text-anchor="middle">FRESH ORGANIC FARM MARKET</text>

  <!-- Wooden Stall Tables -->
  <rect x="100" y="260" width="600" height="150" fill="#b45309" rx="6"/>
  <rect x="80" y="240" width="640" height="30" fill="#d97706" rx="4"/>
  
  <!-- Produce Crates -->
  <!-- Apples Crate (Red) -->
  <rect x="120" y="200" width="160" height="60" fill="#78350f" rx="3"/>
  <circle cx="145" cy="195" r="14" fill="#dc2626"/>
  <circle cx="170" cy="190" r="14" fill="#ef4444"/>
  <circle cx="195" cy="195" r="14" fill="#dc2626"/>
  <circle cx="220" cy="190" r="14" fill="#ef4444"/>
  <circle cx="245" cy="195" r="14" fill="#dc2626"/>
  <rect x="160" y="270" width="80" height="25" fill="#ffffff" rx="3" stroke="#451a03"/>
  <text x="200" y="287" fill="#000" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">$2.99 / lb</text>

  <!-- Oranges Crate (Orange) -->
  <rect x="320" y="200" width="160" height="60" fill="#78350f" rx="3"/>
  <circle cx="345" cy="195" r="14" fill="#ea580c"/>
  <circle cx="370" cy="190" r="14" fill="#f97316"/>
  <circle cx="395" cy="195" r="14" fill="#ea580c"/>
  <circle cx="420" cy="190" r="14" fill="#f97316"/>
  <circle cx="445" cy="195" r="14" fill="#ea580c"/>
  <rect x="360" y="270" width="80" height="25" fill="#ffffff" rx="3" stroke="#451a03"/>
  <text x="400" y="287" fill="#000" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">$3.49 / lb</text>

  <!-- Greens Crate (Green) -->
  <rect x="520" y="200" width="160" height="60" fill="#78350f" rx="3"/>
  <ellipse cx="550" cy="190" rx="16" ry="12" fill="#16a34a"/>
  <ellipse cx="580" cy="188" rx="16" ry="12" fill="#22c55e"/>
  <ellipse cx="610" cy="190" rx="16" ry="12" fill="#16a34a"/>
  <ellipse cx="640" cy="188" rx="16" ry="12" fill="#22c55e"/>
  <rect x="560" y="270" width="80" height="25" fill="#ffffff" rx="3" stroke="#451a03"/>
  <text x="600" y="287" fill="#000" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">$1.99 / ea</text>
</svg>