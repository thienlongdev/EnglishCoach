<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="wall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="floor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="board" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect x="0" y="0" width="800" height="350" fill="url(#wall)"/>
  <rect x="0" y="350" width="800" height="150" fill="url(#floor)"/>
  
  <!-- Digital Whiteboard -->
  <rect x="220" y="40" width="360" height="220" rx="12" fill="#0f172a" stroke="#334155" stroke-width="6"/>
  <rect x="235" y="55" width="330" height="190" rx="8" fill="url(#board)"/>
  <text x="400" y="90" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Project Architecture Review</text>
  <!-- Charts & Wireframes on Whiteboard -->
  <rect x="260" y="110" width="80" height="60" rx="4" fill="#ffffff" opacity="0.9"/>
  <circle cx="300" cy="140" r="18" fill="#f59e0b"/>
  <rect x="360" y="110" width="80" height="60" rx="4" fill="#ffffff" opacity="0.9"/>
  <line x1="375" y1="150" x2="390" y2="130" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
  <line x1="390" y1="130" x2="405" y2="140" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
  <line x1="405" y1="140" x2="425" y2="120" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
  <rect x="460" y="110" width="80" height="60" rx="4" fill="#ffffff" opacity="0.9"/>
  <rect x="470" y="120" width="60" height="8" fill="#3b82f6" rx="2"/>
  <rect x="470" y="135" width="40" height="6" fill="#94a3b8" rx="2"/>
  <rect x="470" y="148" width="50" height="6" fill="#94a3b8" rx="2"/>
  
  <!-- Conference Table -->
  <ellipse cx="400" cy="420" rx="320" ry="60" fill="#cbd5e1" stroke="#94a3b8" stroke-width="4"/>
  <!-- Laptops & Notebooks on table -->
  <rect x="280" y="400" width="50" height="30" rx="3" fill="#475569"/>
  <polygon points="275,430 335,430 340,436 270,436" fill="#64748b"/>
  <rect x="470" y="400" width="50" height="30" rx="3" fill="#475569"/>
  <polygon points="465,430 525,430 530,436 460,436" fill="#64748b"/>
  <rect x="380" y="415" width="40" height="25" rx="2" fill="#f8fafc" stroke="#94a3b8"/>
  <circle cx="355" cy="425" r="8" fill="#ef4444"/> <!-- Coffee mug -->

  <!-- Colleagues silhouettes/avatars -->
  <!-- Person Left (Presenter) -->
  <circle cx="160" cy="200" r="28" fill="#1e293b"/>
  <path d="M 120 320 C 120 250, 200 250, 200 320 Z" fill="#2563eb"/>
  <line x1="180" y1="260" x2="230" y2="210" stroke="#2563eb" stroke-width="12" stroke-linecap="round"/>
  <!-- Person Right 1 -->
  <circle cx="620" cy="230" r="28" fill="#334155"/>
  <path d="M 580 350 C 580 280, 660 280, 660 350 Z" fill="#0d9488"/>
  <!-- Person Right 2 -->
  <circle cx="700" cy="250" r="26" fill="#475569"/>
  <path d="M 660 370 C 660 310, 740 310, 740 370 Z" fill="#d97706"/>
</svg>