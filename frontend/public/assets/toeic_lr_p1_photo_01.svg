<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <rect width="600" height="400" fill="#f4f6f9"/>
  <!-- Room walls and window -->
  <rect x="0" y="0" width="600" height="280" fill="#e9ecef"/>
  <rect x="40" y="30" width="160" height="180" fill="#d0e2ec" stroke="#8faec4" stroke-width="3"/>
  <line x1="120" y1="30" x2="120" y2="210" stroke="#8faec4" stroke-width="2"/>
  <line x1="40" y1="120" x2="200" y2="120" stroke="#8faec4" stroke-width="2"/>
  <!-- Whiteboard / Presentation screen -->
  <rect x="240" y="40" width="220" height="140" fill="#ffffff" stroke="#adb5bd" stroke-width="4" rx="4"/>
  <line x1="260" y1="70" x2="360" y2="70" stroke="#007bff" stroke-width="4"/>
  <rect x="260" y="90" width="80" height="60" fill="#e3f2fd"/>
  <line x1="360" y1="100" x2="430" y2="100" stroke="#6c757d" stroke-width="3"/>
  <line x1="360" y1="120" x2="420" y2="120" stroke="#6c757d" stroke-width="3"/>
  <!-- Conference Table -->
  <ellipse cx="300" cy="310" rx="240" ry="70" fill="#495057"/>
  <ellipse cx="300" cy="305" rx="230" ry="65" fill="#6c757d"/>
  <!-- Chairs and figures -->
  <rect x="180" y="270" width="40" height="25" fill="#343a40" rx="3"/>
  <rect x="280" y="265" width="40" height="25" fill="#343a40" rx="3"/>
  <rect x="380" y="270" width="40" height="25" fill="#343a40" rx="3"/>
  <!-- Laptops on table -->
  <rect x="190" y="290" width="25" height="15" fill="#adb5bd"/>
  <rect x="290" y="285" width="25" height="15" fill="#adb5bd"/>
  <rect x="390" y="290" width="25" height="15" fill="#adb5bd"/>
  <!-- Notepads and cups -->
  <circle cx="240" cy="305" r="5" fill="#ffffff"/>
  <circle cx="340" cy="300" r="5" fill="#ffffff"/>
  <rect x="250" y="300" width="15" height="20" fill="#ffffff" stroke="#ced4da"/>
</svg>