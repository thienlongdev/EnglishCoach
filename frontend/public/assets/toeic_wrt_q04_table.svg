<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect x="0" y="0" width="600" height="400" fill="#f8fafc"/>
  <!-- Room walls & window -->
  <rect x="40" y="30" width="520" height="180" fill="#f1f5f9"/>
  <rect x="180" y="50" width="240" height="120" fill="#bae6fd" stroke="#94a3b8" stroke-width="4"/>
  <line x1="300" y1="50" x2="300" y2="170" stroke="#94a3b8" stroke-width="3"/>
  <line x1="180" y1="110" x2="420" y2="110" stroke="#94a3b8" stroke-width="3"/>

  <!-- Round Conference Table -->
  <ellipse cx="300" cy="270" rx="220" ry="75" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="4"/>
  <!-- Chairs around table -->
  <rect x="120" y="240" width="35" height="50" rx="6" fill="#475569"/>
  <rect x="445" y="240" width="35" height="50" rx="6" fill="#475569"/>
  <rect x="210" y="310" width="50" height="35" rx="6" fill="#475569"/>
  <rect x="340" y="310" width="50" height="35" rx="6" fill="#475569"/>
  
  <!-- Table settings (ready for meeting) -->
  <rect x="200" y="255" width="25" height="20" rx="2" fill="#ffffff" stroke="#94a3b8"/>
  <rect x="270" y="245" width="25" height="20" rx="2" fill="#ffffff" stroke="#94a3b8"/>
  <rect x="340" y="245" width="25" height="20" rx="2" fill="#ffffff" stroke="#94a3b8"/>
  <circle cx="235" cy="265" r="5" fill="#3b82f6"/> <!-- Glass/mug -->
  <circle cx="375" cy="255" r="5" fill="#3b82f6"/> <!-- Glass/mug -->

  <!-- Words Overlay -->
  <rect x="160" y="340" width="130" height="30" rx="6" fill="#1e293b"/>
  <text x="225" y="360" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">ready</text>
  <rect x="310" y="340" width="130" height="30" rx="6" fill="#1e293b"/>
  <text x="375" y="360" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">table</text>
</svg>