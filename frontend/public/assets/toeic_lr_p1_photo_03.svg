<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <rect width="600" height="400" fill="#f8f9fa"/>
  <!-- Hotel Lobby Wall -->
  <rect x="0" y="0" width="600" height="230" fill="#dee2e6"/>
  <rect x="80" y="40" width="120" height="100" fill="#e9ecef" stroke="#ced4da" stroke-width="3"/>
  <rect x="240" y="40" width="120" height="100" fill="#e9ecef" stroke="#ced4da" stroke-width="3"/>
  <rect x="400" y="40" width="120" height="100" fill="#e9ecef" stroke="#ced4da" stroke-width="3"/>
  <!-- Reception Counter -->
  <rect x="100" y="210" width="400" height="130" fill="#4e342e" rx="6"/>
  <rect x="80" y="200" width="440" height="20" fill="#8d6e63" rx="3"/>
  <!-- Counter equipment -->
  <rect x="160" y="160" width="50" height="40" fill="#37474f" rx="2"/>
  <line x1="185" y1="200" x2="185" y2="210" stroke="#37474f" stroke-width="4"/>
  <!-- Service bell & key card holder -->
  <circle cx="340" cy="195" r="8" fill="#ffd700"/>
  <rect x="380" y="180" width="30" height="20" fill="#ffffff" stroke="#b0bec5"/>
  <!-- Receptionist silhouette behind counter -->
  <circle cx="280" cy="140" r="24" fill="#546e7a"/>
  <path d="M 245 200 Q 280 170 315 200 Z" fill="#37474f"/>
</svg>