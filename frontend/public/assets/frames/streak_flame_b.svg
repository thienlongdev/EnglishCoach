<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- [ASSET_REQUIRED] Production-grade vector artwork (Hand-crafted vector finalization) -->
  <!-- Series: streak_flame | Stage: 2 | Tier: B | Slug: streak_flame_stage_2 | Achievement Lineage: Forged Gold & Dual Flame -->
  <!-- Production Vector Quality: PRODUCTION_READY_VECTOR | External Studio/Rive Hand-off: ASSET_REQUIRED -->
  <!-- Center: (50, 50), Avatar Aperture: r=40 (80px boundary) -->
  <defs>
    <linearGradient id="flameBGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <linearGradient id="flameBDualFire" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#ea580c"/>
      <stop offset="75%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>

    <filter id="flameBDropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#451a03" flood-opacity="0.45"/>
    </filter>

    <filter id="flameBGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Core Forged Gold Ring with Crimson Channel -->
  <g class="flame-b-core" filter="url(#flameBDropShadow)">
    <circle cx="50" cy="50" r="44.8" stroke="#451a03" stroke-width="4.2"/>
    <circle cx="50" cy="50" r="44" stroke="url(#flameBGoldGrad)" stroke-width="3"/>
    <circle cx="50" cy="50" r="41.2" stroke="url(#flameBDualFire)" stroke-width="1.2"/>
  </g>

  <!-- Dual Flame Wings (Song Diệm - 30-Day Milestone Crest at Top) -->
  <g class="flame-b-dual-crest" filter="url(#flameBGlow)">
    <!-- Left Dancing Flame Wing -->
    <path d="M47 3 C49 8, 44 12, 41 16 C38 12, 42 7, 47 3 Z" fill="url(#flameBDualFire)" stroke="#78350f" stroke-width="0.5"/>
    <path d="M44 8 C46 11, 43 14, 41 16 C40 14, 42 11, 44 8 Z" fill="#fef08a"/>

    <!-- Right Dancing Flame Wing -->
    <path d="M53 3 C51 8, 56 12, 59 16 C62 12, 58 7, 53 3 Z" fill="url(#flameBDualFire)" stroke="#78350f" stroke-width="0.5"/>
    <path d="M56 8 C54 11, 57 14, 59 16 C60 14, 58 11, 56 8 Z" fill="#fef08a"/>

    <!-- Central Flame Core Gem (Ruby Ember) -->
    <circle cx="50" cy="12" r="3.2" fill="url(#flameBDualFire)" stroke="url(#flameBGoldGrad)" stroke-width="0.8"/>
    <circle cx="50" cy="11.2" r="1.2" fill="#ffffff"/>
  </g>

  <!-- Flame Spur Trim at Flanks & Base -->
  <g fill="url(#flameBGoldGrad)" stroke="#78350f" stroke-width="0.4">
    <!-- Left Spur -->
    <path d="M7 47 C10 44, 12 47, 12 50 C12 53, 10 56, 7 53 Z"/>
    <!-- Right Spur -->
    <path d="M93 47 C90 44, 88 47, 88 50 C88 53, 90 56, 93 53 Z"/>
    <!-- Bottom Anchor Flame Leaf -->
    <path d="M50 97 C47 93, 49 90, 50 88 C51 90, 53 93, 50 97 Z" fill="url(#flameBDualFire)"/>
  </g>
</svg>
