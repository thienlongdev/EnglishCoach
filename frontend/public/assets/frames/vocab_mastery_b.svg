<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- [ASSET_REQUIRED] Production-grade vector artwork (Hand-crafted vector finalization) -->
  <!-- Series: vocab_mastery | Stage: 2 | Tier: B | Slug: vocab_mastery_stage_2 | Achievement Lineage: Gilded Manuscript & Sapphire -->
  <!-- Production Vector Quality: PRODUCTION_READY_VECTOR | External Studio/Rive Hand-off: ASSET_REQUIRED -->
  <!-- Center: (50, 50), Avatar Aperture: r=40 (80px boundary) -->
  <defs>
    <linearGradient id="vocabBGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#eab308"/>
      <stop offset="70%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>

    <linearGradient id="vocabBSapphireGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="40%" stop-color="#2563eb"/>
      <stop offset="80%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>

    <filter id="vocabBDropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#451a03" flood-opacity="0.4"/>
    </filter>

    <filter id="vocabBGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Gilded Manuscript Band with Engraved Notches -->
  <g class="vocab-b-core" filter="url(#vocabBDropShadow)">
    <circle cx="50" cy="50" r="45" stroke="#451a03" stroke-width="4.2"/>
    <circle cx="50" cy="50" r="44.2" stroke="url(#vocabBGoldGrad)" stroke-width="3"/>
    <circle cx="50" cy="50" r="41.2" stroke="url(#vocabBSapphireGrad)" stroke-width="1.2"/>
  </g>

  <!-- Illuminated Codex Scroll Corner Ornaments -->
  <g fill="url(#vocabBGoldGrad)" stroke="#713f12" stroke-width="0.5" filter="url(#vocabBDropShadow)">
    <!-- Top-Left Filigree Scroll -->
    <path d="M19 19 C14 16, 12 24, 16 26 C18 24, 18 20, 21 21 Z"/>
    <!-- Top-Right Filigree Scroll -->
    <path d="M81 19 C86 16, 88 24, 84 26 C82 24, 82 20, 79 21 Z"/>
    <!-- Bottom-Left Filigree Scroll -->
    <path d="M19 81 C14 84, 12 76, 16 74 C18 76, 18 80, 21 79 Z"/>
    <!-- Bottom-Right Filigree Scroll -->
    <path d="M81 81 C86 84, 88 76, 84 74 C82 76, 82 80, 79 79 Z"/>
  </g>

  <!-- Top Apex: Gilded Scholar's Tome Crest with Sapphire Gemstone (500-Vocab Milestone) -->
  <g class="vocab-b-crest" filter="url(#vocabBGlow)">
    <!-- Open Book / Codex Pages Silhouette -->
    <path d="M50 8 C46 5, 39 4, 34 7 L36 14 C40 12, 47 13, 50 16 C53 13, 60 12, 64 14 L66 7 C61 4, 54 5, 50 8 Z" fill="url(#vocabBGoldGrad)" stroke="#713f12" stroke-width="0.6"/>
    <!-- Sapphire Gemstone Inset in Book Spine -->
    <polygon points="50,6 53,10 50,14 47,10" fill="url(#vocabBSapphireGrad)" stroke="#fef08a" stroke-width="0.6"/>
    <circle cx="50" cy="9.5" r="1" fill="#ffffff"/>
  </g>

  <!-- Bottom Anchor: Wisdom Seal -->
  <circle cx="50" cy="93" r="2.8" fill="url(#vocabBSapphireGrad)" stroke="url(#vocabBGoldGrad)" stroke-width="0.8"/>
  <circle cx="50" cy="93" r="1.2" fill="#fef08a"/>
</svg>
