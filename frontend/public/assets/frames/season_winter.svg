<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- [ASSET_REQUIRED] Production-grade vector artwork -->
  <!-- Series: four_seasons | Tier: S | Slug: season_winter | VisualTheme: WINTER -->
  <!-- Center: (50, 50), Avatar aperture: r=40.5, Canvas: 100x100 -->
  <defs>
    <linearGradient id="winterFrostGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#e0f2fe"/>
      <stop offset="65%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="winterIceGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="85%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <radialGradient id="winterFrostMistAura" cx="50%" cy="50%" r="50%">
      <stop offset="68%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="88%" stop-color="#bae6fd" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>

    <filter id="winterIceGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Frost Mist Aura -->
  <circle cx="50" cy="50" r="47.5" fill="url(#winterFrostMistAura)" />

  <!-- Crystalline Ice Ring -->
  <circle cx="50" cy="50" r="45" stroke="url(#winterIceGrad)" stroke-width="2.8" />
  <circle cx="50" cy="50" r="43.2" stroke="#bae6fd" stroke-width="1.2" stroke-dasharray="10 4" />
  <circle cx="50" cy="50" r="41.5" stroke="#ffffff" stroke-width="0.8" opacity="0.9" />

  <!-- 6-Pointed Crystalline Snowflake Motifs & Glacial Shards -->
  <g filter="url(#winterIceGlow)">
    <!-- Top Center Master Ice Crystal -->
    <g transform="translate(50, 7)">
      <!-- Central vertical shard -->
      <polygon points="0,-5 2.5,0 0,5 -2.5,0" fill="url(#winterFrostGrad)" stroke="#ffffff" stroke-width="0.5" />
      <!-- Horizontal crossbar -->
      <line x1="-4" y1="0" x2="4" y2="0" stroke="#ffffff" stroke-width="0.8" />
      <circle cx="0" cy="0" r="1.5" fill="#ffffff" />
    </g>

    <!-- Bottom Crescent Moon & Ice Star -->
    <g transform="translate(50, 93)">
      <path d="M -6 -2 C -2 3 2 3 6 -2 C 3 4 -3 4 -6 -2 Z" fill="url(#winterFrostGrad)" />
      <circle cx="0" cy="0" r="1.5" fill="#ffffff" />
    </g>

    <!-- Glacial Spikes at 60-degree increments around ring -->
    <!-- 30 deg (Top Right) -->
    <polygon points="76,18 78,24 72,22" fill="url(#winterFrostGrad)" />
    <!-- 90 deg (Right) -->
    <polygon points="96,50 89,47 89,53" fill="url(#winterFrostGrad)" />
    <!-- 150 deg (Bottom Right) -->
    <polygon points="76,82 72,78 78,76" fill="url(#winterFrostGrad)" />
    <!-- 210 deg (Bottom Left) -->
    <polygon points="24,82 22,76 28,78" fill="url(#winterFrostGrad)" />
    <!-- 270 deg (Left) -->
    <polygon points="4,50 11,53 11,47" fill="url(#winterFrostGrad)" />
    <!-- 330 deg (Top Left) -->
    <polygon points="24,18 28,22 22,24" fill="url(#winterFrostGrad)" />
  </g>

  <!-- Glacial Diamond Gems -->
  <g fill="#ffffff" stroke="#38bdf8" stroke-width="0.6">
    <circle cx="72" cy="28" r="1.8" />
    <circle cx="72" cy="72" r="1.8" />
    <circle cx="28" cy="72" r="1.8" />
    <circle cx="28" cy="28" r="1.8" />
  </g>

  <!-- Center Aperture: r=40.5 transparent for avatar face -->
</svg>
