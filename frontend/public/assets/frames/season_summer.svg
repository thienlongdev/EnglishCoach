<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- [ASSET_REQUIRED] Production-grade vector artwork -->
  <!-- Series: four_seasons | Tier: S | Slug: season_summer | VisualTheme: SUMMER -->
  <!-- Center: (50, 50), Avatar aperture: r=40.5, Canvas: 100x100 -->
  <defs>
    <linearGradient id="summerGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="30%" stop-color="#fde047"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="summerSolarRay" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="90%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <radialGradient id="summerCoronaAura" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#f59e0b" stop-opacity="0"/>
      <stop offset="88%" stop-color="#fbbf24" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>

    <filter id="summerHeatGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Solar Corona -->
  <circle cx="50" cy="50" r="47.5" fill="url(#summerCoronaAura)" />

  <!-- 12 Radiating Solar Corona Flares / Sun Rays -->
  <g filter="url(#summerHeatGlow)" fill="url(#summerSolarRay)">
    <!-- Cardinal Directions (Large Rays) -->
    <path d="M 50 2 L 53 10 L 47 10 Z" />
    <path d="M 98 50 L 90 53 L 90 47 Z" />
    <path d="M 50 98 L 47 90 L 53 90 Z" />
    <path d="M 2 50 L 10 47 L 10 53 Z" />

    <!-- Diagonal Secondary Rays -->
    <path d="M 84 16 L 79 23 L 75 19 Z" />
    <path d="M 84 84 L 75 81 L 79 77 Z" />
    <path d="M 16 84 L 21 77 L 25 81 Z" />
    <path d="M 16 16 L 25 19 L 21 23 Z" />

    <!-- Tertiary Micro Solar Flares -->
    <path d="M 68 6 L 68 12 L 64 10 Z" opacity="0.85" />
    <path d="M 94 32 L 88 32 L 90 36 Z" opacity="0.85" />
    <path d="M 94 68 L 90 64 L 88 68 Z" opacity="0.85" />
    <path d="M 68 94 L 64 90 L 68 88 Z" opacity="0.85" />
    <path d="M 32 94 L 32 88 L 36 90 Z" opacity="0.85" />
    <path d="M 6 68 L 12 68 L 10 64 Z" opacity="0.85" />
    <path d="M 6 32 L 10 36 L 12 32 Z" opacity="0.85" />
    <path d="M 32 6 L 36 10 L 32 12 Z" opacity="0.85" />
  </g>

  <!-- Core Radiant Gold Solar Ring -->
  <circle cx="50" cy="50" r="45" stroke="url(#summerGoldGrad)" stroke-width="2.8" />
  <circle cx="50" cy="50" r="43.2" stroke="#ea580c" stroke-width="1.2" stroke-dasharray="6 3" />
  <circle cx="50" cy="50" r="41.5" stroke="#fef08a" stroke-width="0.8" opacity="0.9" />

  <!-- Solar Diamond Jewels at Compass Points -->
  <g fill="#ffffff" stroke="#f59e0b" stroke-width="0.8" filter="url(#summerHeatGlow)">
    <polygon points="50,6 52.5,9 50,11.5 47.5,9" />
    <polygon points="94,50 91.5,52.5 89,50 91.5,47.5" />
    <polygon points="50,94 47.5,91.5 50,89 52.5,91.5" />
    <polygon points="6,50 8.5,47.5 11,50 8.5,52.5" />
  </g>

  <!-- Center Aperture: r=40.5 transparent for avatar face -->
</svg>
