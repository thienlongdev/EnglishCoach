<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- [ASSET_REQUIRED] Production-grade vector artwork -->
  <!-- Series: four_seasons | Tier: S | Slug: season_spring | VisualTheme: SPRING -->
  <!-- Center: (50, 50), Avatar aperture: r=40.5, Canvas: 100x100 -->
  <defs>
    <linearGradient id="springVineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <linearGradient id="springPetalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf2f8"/>
      <stop offset="40%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>

    <radialGradient id="springAuraHalo" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#10b981" stop-opacity="0"/>
      <stop offset="92%" stop-color="#34d399" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0"/>
    </radialGradient>

    <filter id="springSoftGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Spring Halo -->
  <circle cx="50" cy="50" r="47" fill="url(#springAuraHalo)" />

  <!-- Entwined Verdant Vines Core Ring -->
  <circle cx="50" cy="50" r="45" stroke="url(#springVineGrad)" stroke-width="2.8" stroke-linecap="round" />
  <circle cx="50" cy="50" r="43.2" stroke="#6ee7b7" stroke-width="1.2" stroke-dasharray="8 4" opacity="0.85" />
  <circle cx="50" cy="50" r="41.5" stroke="#fbcfe8" stroke-width="0.8" opacity="0.9" />

  <!-- Sprouting Leaves along the Ring -->
  <g fill="url(#springVineGrad)" filter="url(#springSoftGlow)">
    <!-- Top-left leaves -->
    <path d="M 23 23 C 20 17 26 13 31 16 C 30 22 25 24 23 23 Z" />
    <path d="M 20 28 C 14 24 16 18 22 19 C 23 25 21 28 20 28 Z" opacity="0.8" />

    <!-- Top-right leaves -->
    <path d="M 77 23 C 80 17 74 13 69 16 C 70 22 75 24 77 23 Z" />
    <path d="M 80 28 C 86 24 84 18 78 19 C 77 25 79 28 80 28 Z" opacity="0.8" />

    <!-- Bottom-left leaves -->
    <path d="M 22 75 C 15 78 18 85 24 83 C 24 77 22 75 22 75 Z" />
    <!-- Bottom-right leaves -->
    <path d="M 78 75 C 85 78 82 85 76 83 C 76 77 78 75 78 75 Z" />
  </g>

  <!-- Blooming Cherry Blossom Petals & Crest Motif -->
  <!-- Top Center Blossom -->
  <g transform="translate(50, 8)" filter="url(#springSoftGlow)">
    <!-- 5 Petals of Spring Blossom -->
    <circle cx="0" cy="-3.5" r="3" fill="url(#springPetalGrad)" />
    <circle cx="3.3" cy="-1.1" r="3" fill="url(#springPetalGrad)" />
    <circle cx="2.1" cy="2.8" r="3" fill="url(#springPetalGrad)" />
    <circle cx="-2.1" cy="2.8" r="3" fill="url(#springPetalGrad)" />
    <circle cx="-3.3" cy="-1.1" r="3" fill="url(#springPetalGrad)" />
    <!-- Blossom Pistil / Center Pearl -->
    <circle cx="0" cy="0" r="1.8" fill="#fef08a" stroke="#f472b6" stroke-width="0.5" />
  </g>

  <!-- Bottom Crest Blossom Accent -->
  <g transform="translate(50, 92)" filter="url(#springSoftGlow)">
    <circle cx="-3" cy="0" r="2.4" fill="url(#springPetalGrad)" />
    <circle cx="3" cy="0" r="2.4" fill="url(#springPetalGrad)" />
    <circle cx="0" cy="2.5" r="2.4" fill="url(#springPetalGrad)" />
    <circle cx="0" cy="0" r="1.4" fill="#fef08a" />
  </g>

  <!-- East & West Blossom Buds -->
  <circle cx="94" cy="50" r="2.5" fill="url(#springPetalGrad)" stroke="#34d399" stroke-width="0.6" />
  <circle cx="6" cy="50" r="2.5" fill="url(#springPetalGrad)" stroke="#34d399" stroke-width="0.6" />

  <!-- Center Aperture: r=40.5 transparent for avatar face -->
</svg>
