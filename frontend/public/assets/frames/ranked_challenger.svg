<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- [ASSET_REQUIRED] Production-grade vector artwork (Hand-crafted vector finalization) -->
  <!-- Series: ranked_arena | Tier: SS | Slug: ranked_challenger | Ranked Lineage: Apex Challenger Cyber-Cyan & Grandmaster Crest -->
  <!-- Production Vector Quality: PRODUCTION_READY_VECTOR | External Studio/Rive Hand-off: ASSET_REQUIRED -->
  <!-- Center: (50, 50), Avatar Aperture: r=40 (80px boundary) -->
  <defs>
    <linearGradient id="challengerSilverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#e2e8f0"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <linearGradient id="challengerCyanGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="35%" stop-color="#06b6d4"/>
      <stop offset="75%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#ecfeff"/>
    </linearGradient>

    <filter id="challengerCyanGlowFX" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="challengerDropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Luminous Cyan Power Conduits (Orbital Ring) -->
  <g class="challenger-conduits" opacity="0.75">
    <circle cx="50" cy="50" r="48" stroke="url(#challengerCyanGlow)" stroke-width="0.8" stroke-dasharray="4 8 16 8"/>
    <!-- Cyber Energy Node Pips -->
    <circle cx="16" cy="16" r="1.5" fill="#22d3ee"/>
    <circle cx="84" cy="16" r="1.5" fill="#22d3ee"/>
    <circle cx="16" cy="84" r="1.5" fill="#22d3ee"/>
    <circle cx="84" cy="84" r="1.5" fill="#22d3ee"/>
  </g>

  <!-- Soaring Battle Wings (Flank Spikes) -->
  <g fill="url(#challengerSilverGrad)" stroke="url(#challengerCyanGlow)" stroke-width="0.8" filter="url(#challengerDropShadow)">
    <!-- Left Cyber Wings -->
    <path d="M12 36 L0 28 L6 42 L2 50 L10 50 Z"/>
    <path d="M10 54 L2 54 L6 62 L0 74 L12 64 Z"/>

    <!-- Right Cyber Wings -->
    <path d="M88 36 L100 28 L94 42 L98 50 L90 50 Z"/>
    <path d="M90 54 L98 54 L94 62 L100 74 L88 64 Z"/>
  </g>

  <!-- Heavy Diamond Silver Core Frame -->
  <g class="challenger-core" filter="url(#challengerDropShadow)">
    <circle cx="50" cy="50" r="45.5" stroke="#0f172a" stroke-width="5"/>
    <circle cx="50" cy="50" r="44.5" stroke="url(#challengerSilverGrad)" stroke-width="3.5"/>
    <circle cx="50" cy="50" r="40.8" stroke="url(#challengerCyanGlow)" stroke-width="1.4"/>
  </g>

  <!-- Top Apex: Grandmaster Challenger Crown (Apex Prestige) -->
  <g class="challenger-apex-crown" filter="url(#challengerCyanGlowFX)">
    <g fill="url(#challengerSilverGrad)" stroke="url(#challengerCyanGlow)" stroke-width="0.8">
      <path d="M50 0 L56 10 L62 4 L58 14 L50 17 L42 14 L38 4 L44 10 Z"/>
    </g>
    <!-- Radiant Cyan Core Crystal -->
    <polygon points="50,3 54,9 50,14 46,9" fill="url(#challengerCyanGlow)" stroke="#ffffff" stroke-width="0.6"/>
    <circle cx="50" cy="8.5" r="1.2" fill="#ffffff"/>

    <!-- Bottom Crystal Blade Anchor -->
    <path d="M50 100 L56 90 L50 93 L44 90 Z" fill="url(#challengerSilverGrad)" stroke="url(#challengerCyanGlow)" stroke-width="0.8"/>
    <polygon points="50,98 53,92 50,94 47,92" fill="url(#challengerCyanGlow)"/>
  </g>
</svg>
