<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- [ASSET_REQUIRED] Production-grade vector artwork -->
  <!-- Series: premium_membership | Tier: B | Slug: premium_ruby_crest | Plan: PLAN_1_MONTH -->
  <!-- Center: (50, 50), Avatar aperture: r=40.5, Canvas: 100x100 -->
  <defs>
    <linearGradient id="rubyGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="35%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>

    <linearGradient id="rubyGemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="40%" stop-color="#f43f5e"/>
      <stop offset="80%" stop-color="#be123c"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>

    <filter id="rubySoftGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Clean Polished Gold Bezel -->
  <circle cx="50" cy="50" r="44.8" stroke="url(#rubyGoldGrad)" stroke-width="2.4" />
  <circle cx="50" cy="50" r="43.2" stroke="#be123c" stroke-width="1" />
  <circle cx="50" cy="50" r="41.6" stroke="#fde047" stroke-width="0.8" opacity="0.9" />

  <!-- Top Ruby Crest Accent -->
  <g transform="translate(50, 7)" filter="url(#rubySoftGlow)">
    <!-- Golden Crest Setting -->
    <path d="M 0 -3 L 3.5 0 L 0 3 L -3.5 0 Z" fill="url(#rubyGoldGrad)" />
    <!-- Ruby Gem Core -->
    <polygon points="0,-2 2,0 0,2 -2,0" fill="url(#rubyGemGrad)" stroke="#ffffff" stroke-width="0.4" />
  </g>

  <!-- Four Ruby Corner Studs -->
  <circle cx="19" cy="19" r="1.8" fill="url(#rubyGemGrad)" stroke="#fef08a" stroke-width="0.5" />
  <circle cx="81" cy="19" r="1.8" fill="url(#rubyGemGrad)" stroke="#fef08a" stroke-width="0.5" />
  <circle cx="81" cy="81" r="1.8" fill="url(#rubyGemGrad)" stroke="#fef08a" stroke-width="0.5" />
  <circle cx="19" cy="81" r="1.8" fill="url(#rubyGemGrad)" stroke="#fef08a" stroke-width="0.5" />

  <!-- Bottom Sovereign Notch -->
  <polygon points="50,91 52,94 48,94" fill="url(#rubyGoldGrad)" />

  <!-- Center Aperture: r=40.5 transparent for avatar face -->
</svg>
