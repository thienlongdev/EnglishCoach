    <path d="M46 90 C42 89, 38 86, 36 82 C39 83, 43 85, 45 88 Z"/>
    <path d="M40 85 C36 84, 32 80, 31 75 C34 77, 38 80, 39 83 Z"/>
    <path d="M34 79 C30 77, 27 73, 26 68 C29 70, 32 74, 33 77 Z"/>
