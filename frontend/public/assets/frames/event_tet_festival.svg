<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- [ASSET_REQUIRED] Production-grade vector artwork -->
  <!-- Series: special_events | Tier: A | Slug: event_tet_festival | Event: TET_FESTIVAL -->
  <!-- Center: (50, 50), Avatar aperture: r=40.5, Canvas: 100x100 -->
  <defs>
    <linearGradient id="tetRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="35%" stop-color="#ef4444"/>
      <stop offset="70%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>

    <linearGradient id="tetGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="30%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <linearGradient id="tetMaiFlower" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>

    <linearGradient id="tetDaoFlower" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf2f8"/>
      <stop offset="50%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <filter id="tetFestivalGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Festive Crimson Silk & Gold Core Ring -->
  <circle cx="50" cy="50" r="45" stroke="url(#tetRedGrad)" stroke-width="2.8" />
  <circle cx="50" cy="50" r="43.2" stroke="url(#tetGoldGrad)" stroke-width="1.2" stroke-dasharray="10 4" />
  <circle cx="50" cy="50" r="41.5" stroke="#fef08a" stroke-width="0.8" opacity="0.9" />

  <!-- Top Center: Lucky Golden Coin & Red Knot Motif -->
  <g transform="translate(50, 7)" filter="url(#tetFestivalGlow)">
    <!-- Red Silk Ribbon Knot -->
    <path d="M -7 4 C -4 0 0 1 0 3 C 0 1 4 0 7 4 Z" fill="url(#tetRedGrad)" />
    <!-- Round Lucky Coin with Square Hole -->
    <circle cx="0" cy="0" r="4.2" fill="url(#tetGoldGrad)" stroke="#fef08a" stroke-width="0.6" />
    <rect x="-1.4" y="-1.4" width="2.8" height="2.8" fill="#991b1b" stroke="#fef08a" stroke-width="0.4" />
  </g>

  <!-- Bottom Accent: Yellow Apricot Blossom (Hoa Mai) -->
  <g transform="translate(50, 93)" filter="url(#tetFestivalGlow)">
    <circle cx="0" cy="-2.5" r="2" fill="url(#tetMaiFlower)" />
    <circle cx="2.4" cy="-0.8" r="2" fill="url(#tetMaiFlower)" />
    <circle cx="1.5" cy="2" r="2" fill="url(#tetMaiFlower)" />
    <circle cx="-1.5" cy="2" r="2" fill="url(#tetMaiFlower)" />
    <circle cx="-2.4" cy="-0.8" r="2" fill="url(#tetMaiFlower)" />
    <circle cx="0" cy="0" r="1.1" fill="#dc2626" />
  </g>

  <!-- East & West: Peach Blossom Branches (Hoa Đào) -->
  <!-- West Peach Blossom -->
  <g transform="translate(7, 50)" filter="url(#tetFestivalGlow)">
    <circle cx="0" cy="-2" r="1.8" fill="url(#tetDaoFlower)" />
    <circle cx="2" cy="0" r="1.8" fill="url(#tetDaoFlower)" />
    <circle cx="0" cy="2" r="1.8" fill="url(#tetDaoFlower)" />
    <circle cx="-2" cy="0" r="1.8" fill="url(#tetDaoFlower)" />
    <circle cx="0" cy="0" r="1" fill="#fef08a" />
  </g>

  <!-- East Yellow Apricot Blossom -->
  <g transform="translate(93, 50)" filter="url(#tetFestivalGlow)">
    <circle cx="0" cy="-2" r="1.8" fill="url(#tetMaiFlower)" />
    <circle cx="2" cy="0" r="1.8" fill="url(#tetMaiFlower)" />
    <circle cx="0" cy="2" r="1.8" fill="url(#tetMaiFlower)" />
    <circle cx="-2" cy="0" r="1.8" fill="url(#tetMaiFlower)" />
    <circle cx="0" cy="0" r="1" fill="#dc2626" />
  </g>

  <!-- Golden Lantern Beads at 45-degree points -->
  <circle cx="20" cy="20" r="1.8" fill="url(#tetGoldGrad)" stroke="#fef08a" stroke-width="0.5" />
  <circle cx="80" cy="20" r="1.8" fill="url(#tetGoldGrad)" stroke="#fef08a" stroke-width="0.5" />
  <circle cx="80" cy="80" r="1.8" fill="url(#tetGoldGrad)" stroke="#fef08a" stroke-width="0.5" />
  <circle cx="20" cy="80" r="1.8" fill="url(#tetGoldGrad)" stroke="#fef08a" stroke-width="0.5" />

  <!-- Center Aperture: r=40.5 transparent for avatar face -->
</svg>
