<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- [ASSET_REQUIRED] Production-grade vector artwork (Hand-crafted vector finalization) -->
  <!-- Series: ranked_arena | Tier: S | Slug: ranked_master | Ranked Lineage: Gladiator Obsidian Steel & Duel Blades -->
  <!-- Production Vector Quality: PRODUCTION_READY_VECTOR | External Studio/Rive Hand-off: ASSET_REQUIRED -->
  <!-- Center: (50, 50), Avatar Aperture: r=40 (80px boundary) -->
  <defs>
    <linearGradient id="rankedObsidianGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="35%" stop-color="#1e293b"/>
      <stop offset="70%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="rankedMasterViolet" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6b21a8"/>
      <stop offset="40%" stop-color="#a855f7"/>
      <stop offset="75%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#fdf4ff"/>
    </linearGradient>

    <filter id="rankedMasterGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="rankedMasterDropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#020617" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Heavy Obsidian Steel Gladiator Rim -->
  <g class="ranked-master-core" filter="url(#rankedMasterDropShadow)">
    <circle cx="50" cy="50" r="45.5" stroke="#020617" stroke-width="5"/>
    <circle cx="50" cy="50" r="44.5" stroke="url(#rankedObsidianGrad)" stroke-width="3.5"/>
    <circle cx="50" cy="50" r="40.8" stroke="url(#rankedMasterViolet)" stroke-width="1.4"/>
  </g>

  <!-- Flanking Jagged Duel-Blade Silhouettes (Left & Right Spikes) -->
  <g fill="url(#rankedObsidianGrad)" stroke="url(#rankedMasterViolet)" stroke-width="0.8" filter="url(#rankedMasterDropShadow)">
    <!-- Left Blade Upper Spike -->
    <path d="M12 40 L0 34 L8 46 Z"/>
    <!-- Left Blade Lower Spike -->
    <path d="M12 60 L0 66 L8 54 Z"/>

    <!-- Right Blade Upper Spike -->
    <path d="M88 40 L100 34 L92 46 Z"/>
    <!-- Right Blade Lower Spike -->
    <path d="M88 60 L100 66 L92 54 Z"/>
  </g>

  <!-- Top Apex: Master Gladiator Crown Spikes -->
  <g class="ranked-master-crown" filter="url(#rankedMasterGlow)">
    <!-- Triple Spiked Battle Diadem -->
    <g fill="url(#rankedObsidianGrad)" stroke="url(#rankedMasterViolet)" stroke-width="0.8">
      <path d="M50 0 L55 9 L58 4 L56 13 L50 16 L44 13 L42 4 L45 9 Z"/>
      <!-- Core Luminous Violet Jewel -->
      <polygon points="50,4 53,9 50,13 47,9" fill="url(#rankedMasterViolet)"/>
      <circle cx="50" cy="8.5" r="1" fill="#ffffff"/>
    </g>

    <!-- Bottom Spiked Battle V-Anchor -->
    <path d="M50 100 L56 91 L50 94 L44 91 Z" fill="url(#rankedObsidianGrad)" stroke="url(#rankedMasterViolet)" stroke-width="0.8"/>
    <polygon points="50,97 53,93 50,95 47,93" fill="url(#rankedMasterViolet)"/>
  </g>
</svg>
