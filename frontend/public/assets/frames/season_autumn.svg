<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- [ASSET_REQUIRED] Production-grade vector artwork -->
  <!-- Series: four_seasons | Tier: S | Slug: season_autumn | VisualTheme: AUTUMN -->
  <!-- Center: (50, 50), Avatar aperture: r=40.5, Canvas: 100x100 -->
  <defs>
    <linearGradient id="autumnLeafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="35%" stop-color="#d97706"/>
      <stop offset="70%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>

    <linearGradient id="autumnAmberGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="40%" stop-color="#d97706"/>
      <stop offset="70%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>

    <radialGradient id="autumnVortexAura" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#d97706" stop-opacity="0"/>
      <stop offset="90%" stop-color="#f59e0b" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0"/>
    </radialGradient>

    <filter id="autumnGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Amber Gust Aura -->
  <circle cx="50" cy="50" r="47" fill="url(#autumnVortexAura)" />

  <!-- Swirling Wind Stream Ring -->
  <circle cx="50" cy="50" r="45" stroke="url(#autumnAmberGrad)" stroke-width="2.6" stroke-linecap="round" />
  <circle cx="50" cy="50" r="43.2" stroke="#d97706" stroke-width="1.2" stroke-dasharray="14 5 4 5" />
  <circle cx="50" cy="50" r="41.5" stroke="#fde68a" stroke-width="0.8" opacity="0.85" />

  <!-- Autumn Maple & Gingko Foliage Crests along the Vortex -->
  <g filter="url(#autumnGlow)">
    <!-- Top Center Sovereign Maple Leaf Crest -->
    <g transform="translate(50, 7)">
      <path d="M 0 -4 L 2 -1 L 5 -2 L 3 2 L 6 4 L 2 5 L 3 8 L 0 6 L -3 8 L -2 5 L -6 4 L -3 2 L -5 -2 L -2 -1 Z" fill="url(#autumnLeafGrad)" stroke="#fef08a" stroke-width="0.5" />
    </g>

    <!-- Top-Right Spiraling Leaf -->
    <g transform="translate(79, 21) rotate(40)">
      <path d="M 0 -4 C 3 -2 4 2 0 5 C -4 2 -3 -2 0 -4 Z" fill="url(#autumnLeafGrad)" />
      <path d="M 0 -4 L 0 5" stroke="#fef08a" stroke-width="0.4" />
    </g>

    <!-- Bottom-Right Spiraling Leaf -->
    <g transform="translate(80, 78) rotate(120)">
      <path d="M 0 -4 C 3 -2 4 2 0 5 C -4 2 -3 -2 0 -4 Z" fill="url(#autumnLeafGrad)" />
      <path d="M 0 -4 L 0 5" stroke="#fef08a" stroke-width="0.4" />
    </g>

    <!-- Bottom Center Wind Motif -->
    <g transform="translate(50, 93)">
      <path d="M -8 -1 C -4 2 4 2 8 -1 C 4 4 -4 4 -8 -1 Z" fill="url(#autumnAmberGrad)" />
      <circle cx="0" cy="1" r="1.8" fill="#fef08a" />
    </g>

    <!-- Bottom-Left Spiraling Leaf -->
    <g transform="translate(20, 79) rotate(-120)">
      <path d="M 0 -4 C 3 -2 4 2 0 5 C -4 2 -3 -2 0 -4 Z" fill="url(#autumnLeafGrad)" />
      <path d="M 0 -4 L 0 5" stroke="#fef08a" stroke-width="0.4" />
    </g>

    <!-- Top-Left Spiraling Leaf -->
    <g transform="translate(21, 21) rotate(-40)">
      <path d="M 0 -4 C 3 -2 4 2 0 5 C -4 2 -3 -2 0 -4 Z" fill="url(#autumnLeafGrad)" />
      <path d="M 0 -4 L 0 5" stroke="#fef08a" stroke-width="0.4" />
    </g>
  </g>

  <!-- Amber Gold Jewels around perimeter -->
  <circle cx="94" cy="50" r="2.2" fill="#f59e0b" stroke="#fff" stroke-width="0.6" />
  <circle cx="6" cy="50" r="2.2" fill="#f59e0b" stroke="#fff" stroke-width="0.6" />

  <!-- Center Aperture: r=40.5 transparent for avatar face -->
</svg>
