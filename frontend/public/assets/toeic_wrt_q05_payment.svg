<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect x="0" y="0" width="600" height="400" fill="#f8fafc"/>
  <!-- Countertop -->
  <rect x="40" y="160" width="520" height="200" rx="12" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="4"/>
  
  <!-- POS Cashier Terminal -->
  <rect x="120" y="90" width="180" height="130" rx="10" fill="#0f172a"/>
  <rect x="135" y="105" width="150" height="85" rx="6" fill="#1e293b"/>
  <text x="210" y="145" fill="#10b981" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">PAYMENT COMPLETE</text>
  <text x="210" y="170" fill="#94a3b8" font-family="monospace" font-size="12" text-anchor="middle">TOTAL: $45.80</text>
  
  <!-- Card Reader / Terminal -->
  <rect x="340" y="130" width="120" height="90" rx="8" fill="#334155"/>
  <rect x="355" y="145" width="90" height="35" rx="4" fill="#0284c7"/>
  <circle cx="400" cy="162" r="10" fill="#22c55e"/>
  <!-- Credit Card Inserted / Tap -->
  <rect x="365" y="105" width="70" height="40" rx="4" fill="#f59e0b" stroke="#d97706"/>

  <!-- Receipt paper coming out -->
  <path d="M 280 100 L 310 100 L 310 60 L 280 60 Z" fill="#ffffff" stroke="#cbd5e1"/>
  <line x1="285" y1="70" x2="305" y2="70" stroke="#94a3b8" stroke-width="2"/>
  <line x1="285" y1="80" x2="305" y2="80" stroke="#94a3b8" stroke-width="2"/>

  <!-- Words Overlay -->
  <rect x="160" y="340" width="130" height="30" rx="6" fill="#1e293b"/>
  <text x="225" y="360" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">payment</text>
  <rect x="310" y="340" width="130" height="30" rx="6" fill="#1e293b"/>
  <text x="375" y="360" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">complete</text>
</svg>