<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <!-- Sky -->
  <rect x="0" y="0" width="600" height="250" fill="#e0f2fe"/>
  <!-- Building Roof Structure -->
  <polygon points="50,250 300,100 550,250" fill="#b91c1c" stroke="#991b1b" stroke-width="4"/>
  <line x1="120" y1="210" x2="480" y2="210" stroke="#7f1d1d" stroke-width="3"/>
  <line x1="180" y1="170" x2="420" y2="170" stroke="#7f1d1d" stroke-width="3"/>
  <rect x="80" y="250" width="440" height="120" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/>

  <!-- Inspector on roof with clipboard & hardhat -->
  <ellipse cx="260" cy="130" rx="14" ry="12" fill="#eab308"/> <!-- Hardhat -->
  <circle cx="260" cy="140" r="10" fill="#fdba74"/> <!-- Face -->
  <path d="M 245 152 L 275 152 L 280 195 L 240 195 Z" fill="#2563eb"/> <!-- Vest -->
  <rect x="270" y="160" width="20" height="28" fill="#78350f" rx="2"/> <!-- Clipboard -->
  <rect x="273" y="163" width="14" height="20" fill="#ffffff"/>

  <!-- Words Overlay -->
  <rect x="160" y="340" width="130" height="30" rx="6" fill="#1e293b"/>
  <text x="225" y="360" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">inspect</text>
  <rect x="310" y="340" width="130" height="30" rx="6" fill="#1e293b"/>
  <text x="375" y="360" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">roof</text>
</svg>