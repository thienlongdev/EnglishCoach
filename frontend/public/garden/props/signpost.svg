<svg viewBox="0 0 64 72" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="signWood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8D5B2F"/>
      <stop offset="60%" stop-color="#6B4423"/>
      <stop offset="100%" stop-color="#4A2E1B"/>
    </linearGradient>
    <linearGradient id="boardWood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A26C40"/>
      <stop offset="50%" stop-color="#B87D4E"/>
      <stop offset="100%" stop-color="#8D5B2F"/>
    </linearGradient>
  </defs>

  <!-- Post Base Shadow -->
  <ellipse cx="32" cy="68" rx="8" ry="3.5" fill="#3E2723" opacity="0.6"/>

  <!-- Vertical Wooden Post -->
  <rect x="29" y="14" width="6" height="54" rx="2" fill="url(#signWood)"/>
  <!-- Post Cap Point -->
  <path d="M29 14 L32 8 L35 14 Z" fill="#6B4423"/>

  <!-- Upper Arrow Signboard: Points Right ("Tri Thức" / Sanctuary) -->
  <g transform="translate(14, 18)">
    <path d="M0 0 L32 0 L40 7 L32 14 L0 14 Z" fill="url(#boardWood)"/>
    <circle cx="16" cy="7" r="1.5" fill="#3D2413"/> <!-- Nail -->
    <!-- Carved icon/symbol: leaf/seed glyph -->
    <path d="M22 7 C22 4 28 4 28 7 C28 10 22 10 22 7 Z" fill="#FEF08A" opacity="0.85"/>
    <circle cx="32" cy="7" r="2" fill="#38BDF8"/>
  </g>

  <!-- Lower Arrow Signboard: Points Left ("Vườn" / Garden) -->
  <g transform="translate(10, 36)">
    <path d="M8 0 L40 0 L40 14 L8 14 L0 7 Z" fill="url(#boardWood)"/>
    <circle cx="24" cy="7" r="1.5" fill="#3D2413"/> <!-- Nail -->
    <!-- Carved sprout glyph -->
    <path d="M14 7 Q17 4 20 7" stroke="#22C55E" stroke-width="1.6" fill="none"/>
    <circle cx="14" cy="7" r="1.5" fill="#22C55E"/>
  </g>
</svg>
