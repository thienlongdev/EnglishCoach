<svg viewBox="0 0 48 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="lanternGlow" cx="24" cy="36" r="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#F59E0B" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ironPost" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#27272A"/>
      <stop offset="50%" stop-color="#52525B"/>
      <stop offset="100%" stop-color="#18181B"/>
    </linearGradient>
  </defs>

  <!-- Ambient Light Halo -->
  <circle cx="24" cy="36" r="26" fill="url(#lanternGlow)"/>

  <!-- Timber/Iron Post -->
  <rect x="22" y="44" width="4" height="34" rx="1.5" fill="url(#ironPost)"/>
  <!-- Post Base Mound -->
  <ellipse cx="24" cy="76" rx="8" ry="3" fill="#3F3F46"/>

  <!-- Lantern Mounting Arm -->
  <path d="M24 50 Q28 46 24 42" stroke="#27272A" stroke-width="2.5" fill="none"/>

  <!-- Lantern Cap / Roof -->
  <path d="M14 26 L24 16 L34 26 Z" fill="#27272A"/>
  <circle cx="24" cy="14" r="2.5" fill="#3F3F46"/>

  <!-- Glowing Glass Chamber -->
  <rect x="16" y="26" width="16" height="18" rx="2" fill="#FDE047"/>
  <!-- Inner Flame / Filament -->
  <circle cx="24" cy="35" r="4.5" fill="#FFFFFF"/>
  <circle cx="24" cy="35" r="7" fill="#F59E0B" opacity="0.6"/>

  <!-- Iron Grille / Caging -->
  <rect x="16" y="26" width="16" height="18" rx="2" stroke="#27272A" stroke-width="1.8" fill="none"/>
  <line x1="24" y1="26" x2="24" y2="44" stroke="#27272A" stroke-width="1.2"/>
  <line x1="16" y1="35" x2="32" y2="35" stroke="#27272A" stroke-width="1.2"/>

  <!-- Lantern Bottom Finial -->
  <path d="M18 44 L24 48 L30 44 Z" fill="#27272A"/>
</svg>
