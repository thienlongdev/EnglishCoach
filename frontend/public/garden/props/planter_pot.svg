<svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="potClay" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C2410C"/>
      <stop offset="35%" stop-color="#EA580C"/>
      <stop offset="70%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#9A3412"/>
    </linearGradient>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="20" cy="37" rx="10" ry="3" fill="#3E2723" opacity="0.6"/>

  <!-- Terracotta Pot Body -->
  <path d="M12 22 L15 36 L25 36 L28 22 Z" fill="url(#potClay)"/>
  <!-- Pot Rim Collar -->
  <rect x="10" y="18" width="20" height="5" rx="1.5" fill="#EA580C"/>
  <rect x="10" y="18" width="20" height="2" fill="#FDBA74" opacity="0.8"/>

  <!-- Soil -->
  <ellipse cx="20" cy="18" rx="8" ry="2.5" fill="#451A03"/>

  <!-- Growing Herb Leaves & Flower -->
  <circle cx="16" cy="14" r="5" fill="#15803D"/>
  <circle cx="24" cy="14" r="5" fill="#16A34A"/>
  <circle cx="20" cy="11" r="5.5" fill="#22C55E"/>
  <!-- Lavender/Rosebud accent -->
  <circle cx="20" cy="8" r="3" fill="#C084FC"/>
  <circle cx="20" cy="8" r="1.2" fill="#FEF08A"/>
</svg>
