<svg viewBox="0 0 48 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="canMetal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="35%" stop-color="#10B981"/>
      <stop offset="70%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="22" cy="37" rx="14" ry="3" fill="#3E2723" opacity="0.6"/>

  <!-- Can Body -->
  <ellipse cx="20" cy="27" rx="11" ry="8" fill="url(#canMetal)"/>

  <!-- Top Handle -->
  <path d="M12 22 C12 12 28 12 28 22" stroke="#047857" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Long Pouring Spout -->
  <path d="M28 28 L38 18" stroke="url(#canMetal)" stroke-width="3" stroke-linecap="round"/>
  <!-- Rose Spout Sprinkler Head (Brass) -->
  <ellipse cx="39" cy="17" rx="4" ry="2.5" transform="rotate(-35, 39, 17)" fill="#F59E0B"/>
  <circle cx="39" cy="17" r="1" fill="#FEF08A"/>

  <!-- Back Grip Handle -->
  <path d="M10 24 C6 24 6 30 11 31" stroke="#047857" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Garden Hand Trowel Leaning Beside -->
  <g transform="translate(36, 26) rotate(30)">
    <rect x="-1" y="-12" width="2" height="6" rx="1" fill="#78350F"/> <!-- Handle -->
    <path d="M-2 -6 L2 -6 L3 4 L0 8 L-3 4 Z" fill="#94A3B8"/> <!-- Metal blade -->
  </g>
</svg>
