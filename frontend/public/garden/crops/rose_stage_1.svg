<svg viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="rBedSoil1" cx="64" cy="98" r="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4E342E"/>
      <stop offset="70%" stop-color="#3E2723"/>
      <stop offset="100%" stop-color="#2D150B" stop-opacity="0.8"/>
    </radialGradient>
    <linearGradient id="roseCaneWood" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#4A2E1B"/>
      <stop offset="60%" stop-color="#166534"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
  </defs>

  <!-- Soil Bed Base -->
  <ellipse cx="64" cy="100" rx="38" ry="14" fill="url(#rBedSoil1)"/>
  <path d="M34 100 Q64 106 94 100" stroke="#3E2723" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Cutting 1: Left Cane with Tiny Red/Green Shoot -->
  <g transform="translate(42, 94)">
    <path d="M0 0 Q-2 -10 -1 -18" stroke="url(#roseCaneWood)" stroke-width="3" stroke-linecap="round"/>
    <path d="M-1 -10 L-4 -8 L-1 -7 Z" fill="#9F1239"/> <!-- Thorn -->
    <!-- Emerging red/bronze leaflets -->
    <path d="M-1 -18 C-6 -22 -4 -26 0 -22 C4 -26 6 -22 0 -18 Z" fill="#BE123C"/>
    <circle cx="0" cy="-21" r="1.5" fill="#4ADE80"/>
  </g>

  <!-- Cutting 2: Center Main Rooted Cane -->
  <g transform="translate(64, 91)">
    <path d="M0 0 Q1 -12 -1 -24" stroke="url(#roseCaneWood)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M-1 -12 L-5 -10 L-1 -9 Z" fill="#9F1239"/> <!-- Thorn -->
    <path d="M0 -18 L3 -16 L0 -15 Z" fill="#9F1239"/> <!-- Thorn -->
    <!-- Leaf cluster -->
    <path d="M-1 -24 C-8 -28 -5 -34 0 -28 C5 -34 8 -28 0 -24 Z" fill="#9F1239"/>
    <path d="M-5 -25 C-10 -22 -9 -30 -3 -27 Z" fill="#15803D"/>
    <path d="M3 -25 C8 -22 7 -30 1 -27 Z" fill="#22C55E"/>
  </g>

  <!-- Cutting 3: Right Cane with Fresh Shoot -->
  <g transform="translate(86, 95)">
    <path d="M0 0 Q2 -10 1 -18" stroke="url(#roseCaneWood)" stroke-width="3" stroke-linecap="round"/>
    <path d="M1 -10 L4 -8 L1 -7 Z" fill="#9F1239"/> <!-- Thorn -->
    <!-- Emerging red/bronze leaflets -->
    <path d="M1 -18 C-4 -22 -2 -26 1 -22 C4 -26 6 -22 1 -18 Z" fill="#BE123C"/>
    <circle cx="1" cy="-21" r="1.5" fill="#4ADE80"/>
  </g>
</svg>