<svg viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="rBedSoil3" cx="64" cy="98" r="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4E342E"/>
      <stop offset="70%" stop-color="#3E2723"/>
      <stop offset="100%" stop-color="#2D150B" stop-opacity="0.8"/>
    </radialGradient>
    <radialGradient id="roseBudRed" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FDA4AF"/>
      <stop offset="35%" stop-color="#FB7185"/>
      <stop offset="70%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#881337"/>
    </radialGradient>
    <linearGradient id="roseCaneWood3" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#14532D"/>
      <stop offset="60%" stop-color="#166534"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
  </defs>

  <!-- Soil Bed Base -->
  <ellipse cx="64" cy="102" rx="42" ry="14" fill="url(#rBedSoil3)"/>
  <ellipse cx="64" cy="100" rx="36" ry="10" fill="#3E2723" opacity="0.6"/>

  <!-- Woody Rose Canes Across the Bed -->
  <path d="M38 100 Q34 76 30 52" stroke="url(#roseCaneWood3)" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M42 80 Q48 64 46 48" stroke="url(#roseCaneWood3)" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M64 100 Q56 74 60 40" stroke="url(#roseCaneWood3)" stroke-width="3.8" stroke-linecap="round"/>
  <path d="M64 100 Q74 74 72 44" stroke="url(#roseCaneWood3)" stroke-width="3.6" stroke-linecap="round"/>
  <path d="M90 100 Q94 76 96 50" stroke="url(#roseCaneWood3)" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M86 80 Q80 64 84 48" stroke="url(#roseCaneWood3)" stroke-width="2.8" stroke-linecap="round"/>

  <!-- Rose Thorns -->
  <path d="M36 84 L32 82 L36 80 Z" fill="#9F1239"/>
  <path d="M60 84 L56 82 L60 80 Z" fill="#9F1239"/>
  <path d="M68 82 L72 80 L68 78 Z" fill="#9F1239"/>
  <path d="M92 84 L96 82 L92 80 Z" fill="#9F1239"/>
  <path d="M32 66 L28 64 L32 62 Z" fill="#9F1239"/>
  <path d="M94 66 L98 64 L94 62 Z" fill="#9F1239"/>

  <!-- Dense Serrated Leaf Clusters -->
  <path d="M24 74 C12 68 14 82 28 78 Z" fill="#15803D"/>
  <path d="M40 68 C52 62 50 76 36 72 Z" fill="#166534"/>
  <path d="M22 56 C10 48 12 64 28 60 Z" fill="#16A34A"/>
  <path d="M48 76 C36 70 38 84 52 80 Z" fill="#15803D"/>
  <path d="M76 74 C88 68 86 82 72 78 Z" fill="#166534"/>
  <path d="M46 54 C34 46 36 62 52 58 Z" fill="#16A34A"/>
  <path d="M78 54 C90 46 88 62 74 58 Z" fill="#15803D"/>
  <path d="M52 42 C42 34 44 48 58 46 Z" fill="#22C55E"/>
  <path d="M72 42 C82 34 80 48 66 46 Z" fill="#4ADE80"/>
  <path d="M86 70 C74 64 76 78 90 74 Z" fill="#15803D"/>
  <path d="M102 76 C114 70 112 84 98 80 Z" fill="#166534"/>
  <path d="M104 58 C116 50 114 66 98 62 Z" fill="#16A34A"/>

  <!-- Swelling Rosebuds with Emerging Ruby Petal Tips & Green Sepals -->
  <!-- Left Bush Bud 1 -->
  <g transform="translate(30, 50)">
    <path d="M0 -12 C-5 -10 -5 0 0 4 C5 0 5 -10 0 -12 Z" fill="url(#roseBudRed)"/>
    <path d="M-4 2 C-7 -4 -2 -10 -1 -12" stroke="#15803D" stroke-width="1.6" fill="none"/>
    <path d="M4 2 C7 -4 2 -10 1 -12" stroke="#15803D" stroke-width="1.6" fill="none"/>
    <ellipse cx="0" cy="3" rx="4.5" ry="3.5" fill="#166534"/>
  </g>
  <!-- Left Bush Bud 2 -->
  <g transform="translate(46, 46)">
    <path d="M0 -10 C-4 -8 -4 0 0 3 C4 0 4 -8 0 -10 Z" fill="url(#roseBudRed)"/>
    <path d="M-3 1 C-5 -3 -2 -8 0 -10" stroke="#15803D" stroke-width="1.4" fill="none"/>
    <path d="M3 1 C5 -3 2 -8 0 -10" stroke="#15803D" stroke-width="1.4" fill="none"/>
    <ellipse cx="0" cy="2" rx="3.5" ry="2.8" fill="#166534"/>
  </g>
  <!-- Center Main Bud (Larger, Swelling) -->
  <g transform="translate(60, 36)">
    <path d="M0 -14 C-6 -12 -6 0 0 5 C6 0 6 -12 0 -14 Z" fill="url(#roseBudRed)"/>
    <path d="M-5 2 C-8 -4 -3 -12 -1 -14" stroke="#15803D" stroke-width="1.8" fill="none"/>
    <path d="M5 2 C8 -4 3 -12 1 -14" stroke="#15803D" stroke-width="1.8" fill="none"/>
    <ellipse cx="0" cy="4" rx="5" ry="4" fill="#166534"/>
    <path d="M-1 -12 C-1 -6 1 -6 1 -12" stroke="#FFE4E6" stroke-width="1" opacity="0.8"/>
  </g>
  <!-- Center Bush Bud 2 -->
  <g transform="translate(72, 42)">
    <path d="M0 -11 C-4.5 -9 -4.5 0 0 3.5 C4.5 0 4.5 -9 0 -11 Z" fill="url(#roseBudRed)"/>
    <path d="M-3.5 1 C-6 -3 -2 -9 0 -11" stroke="#15803D" stroke-width="1.5" fill="none"/>
    <path d="M3.5 1 C6 -3 2 -9 0 -11" stroke="#15803D" stroke-width="1.5" fill="none"/>
    <ellipse cx="0" cy="2.5" rx="4" ry="3" fill="#166534"/>
  </g>
  <!-- Right Bush Bud -->
  <g transform="translate(96, 48)">
    <path d="M0 -12 C-5 -10 -5 0 0 4 C5 0 5 -10 0 -12 Z" fill="url(#roseBudRed)"/>
    <path d="M-4 2 C-7 -4 -2 -10 -1 -12" stroke="#15803D" stroke-width="1.6" fill="none"/>
    <path d="M4 2 C7 -4 2 -10 1 -12" stroke="#15803D" stroke-width="1.6" fill="none"/>
    <ellipse cx="0" cy="3" rx="4.5" ry="3.5" fill="#166534"/>
  </g>
</svg>