<svg viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="tBedSoil3" cx="64" cy="98" r="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4E342E"/>
      <stop offset="70%" stop-color="#3E2723"/>
      <stop offset="100%" stop-color="#2D150B" stop-opacity="0.8"/>
    </radialGradient>
    <linearGradient id="woodPost3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5C3D2E"/>
      <stop offset="50%" stop-color="#8B5E3C"/>
      <stop offset="100%" stop-color="#4A2E1B"/>
    </linearGradient>
    <radialGradient id="greenFruit" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#DCFCE7"/>
      <stop offset="40%" stop-color="#86EFAC"/>
      <stop offset="90%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#15803D"/>
    </radialGradient>
  </defs>

  <!-- Soil Bed Base -->
  <ellipse cx="64" cy="102" rx="42" ry="14" fill="url(#tBedSoil3)"/>
  <ellipse cx="64" cy="100" rx="36" ry="10" fill="#3E2723" opacity="0.6"/>

  <!-- Trellis Framework with Cross-Braces Across Bed -->
  <rect x="36" y="38" width="4" height="64" rx="1.5" fill="url(#woodPost3)"/>
  <rect x="62" y="24" width="4.5" height="78" rx="1.5" fill="url(#woodPost3)"/>
  <rect x="88" y="38" width="4" height="64" rx="1.5" fill="url(#woodPost3)"/>
  <!-- Cross Battens -->
  <path d="M34 52 L92 48" stroke="url(#woodPost3)" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M34 76 L92 72" stroke="url(#woodPost3)" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Vine foliage & stems -->
  <path d="M38 100 Q42 80 37 60 Q42 45 39 36" stroke="#15803D" stroke-width="3" stroke-linecap="round"/>
  <path d="M64 100 Q59 78 65 54 Q61 38 64 24" stroke="#166534" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M90 100 Q86 80 91 60 Q87 45 89 36" stroke="#15803D" stroke-width="3" stroke-linecap="round"/>

  <!-- Leaves across trellis -->
  <path d="M30 76 C18 70 20 84 34 80 Z" fill="#15803D"/>
  <path d="M44 68 C56 62 54 76 40 72 Z" fill="#22C55E"/>
  <path d="M28 50 C16 42 18 58 34 54 Z" fill="#16A34A"/>
  <path d="M52 82 C40 76 42 88 58 84 Z" fill="#15803D"/>
  <path d="M72 74 C86 68 84 82 68 78 Z" fill="#22C55E"/>
  <path d="M52 56 C38 48 40 64 58 60 Z" fill="#166534"/>
  <path d="M74 48 C88 40 86 56 70 52 Z" fill="#16A34A"/>
  <path d="M82 76 C70 70 72 84 86 80 Z" fill="#15803D"/>
  <path d="M96 68 C110 62 108 76 94 72 Z" fill="#22C55E"/>
  <path d="M80 50 C68 42 70 58 86 54 Z" fill="#16A34A"/>

  <!-- Star-shaped Yellow Blossom Flowers -->
  <g transform="translate(34, 46)">
    <path d="M0 -5 L1.5 -1.5 L5 0 L1.5 1.5 L0 5 L-1.5 1.5 L-5 0 L-1.5 -1.5 Z" fill="#FDE047"/>
    <circle cx="0" cy="0" r="1.2" fill="#EAB308"/>
  </g>
  <g transform="translate(72, 38)">
    <path d="M0 -5 L1.5 -1.5 L5 0 L1.5 1.5 L0 5 L-1.5 1.5 L-5 0 L-1.5 -1.5 Z" fill="#FDE047"/>
    <circle cx="0" cy="0" r="1.2" fill="#EAB308"/>
  </g>
  <g transform="translate(94, 44)">
    <path d="M0 -5 L1.5 -1.5 L5 0 L1.5 1.5 L0 5 L-1.5 1.5 L-5 0 L-1.5 -1.5 Z" fill="#FDE047"/>
    <circle cx="0" cy="0" r="1.2" fill="#EAB308"/>
  </g>

  <!-- Growing Green Young Fruit Clusters -->
  <!-- Left Plant Fruit -->
  <g transform="translate(42, 64)">
    <circle cx="0" cy="0" r="7.5" fill="url(#greenFruit)"/>
    <ellipse cx="-2" cy="-2.5" rx="2" ry="1.2" fill="#FFFFFF" opacity="0.6"/>
    <path d="M0 -7.5 L-1.5 -10 M0 -7.5 L1.5 -10 M0 -7.5 L-3.5 -7 M0 -7.5 L3.5 -7" stroke="#15803D" stroke-width="1.2"/>
  </g>
  <!-- Center Plant Fruit Pair -->
  <g transform="translate(58, 68)">
    <circle cx="0" cy="0" r="9" fill="url(#greenFruit)"/>
    <ellipse cx="-2.5" cy="-3" rx="2.5" ry="1.5" fill="#FFFFFF" opacity="0.65"/>
    <path d="M0 -9 L-2 -12 M0 -9 L2 -12 M0 -9 L-4 -8.5 M0 -9 L4 -8.5" stroke="#15803D" stroke-width="1.3"/>
  </g>
  <g transform="translate(70, 72)">
    <circle cx="0" cy="0" r="6.5" fill="url(#greenFruit)"/>
    <ellipse cx="-1.8" cy="-2.2" rx="1.8" ry="1.1" fill="#FFFFFF" opacity="0.6"/>
    <path d="M0 -6.5 L-1.5 -9 M0 -6.5 L1.5 -9" stroke="#15803D" stroke-width="1.1"/>
  </g>
  <!-- Right Plant Fruit -->
  <g transform="translate(86, 62)">
    <circle cx="0" cy="0" r="7.5" fill="url(#greenFruit)"/>
    <ellipse cx="-2" cy="-2.5" rx="2" ry="1.2" fill="#FFFFFF" opacity="0.6"/>
    <path d="M0 -7.5 L-1.5 -10 M0 -7.5 L1.5 -10 M0 -7.5 L-3.5 -7 M0 -7.5 L3.5 -7" stroke="#15803D" stroke-width="1.2"/>
  </g>
</svg>