<svg viewBox="0 0 160 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="wormGlow" cx="80" cy="60" r="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B6CF0" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#8B6CF0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="segmentG" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#DDD6FE"/>
      <stop offset="35%" stop-color="#A78BFA"/>
      <stop offset="75%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#5B21B6"/>
    </radialGradient>
    <radialGradient id="headG" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#E9D5FF"/>
      <stop offset="35%" stop-color="#C084FC"/>
      <stop offset="75%" stop-color="#9333EA"/>
      <stop offset="100%" stop-color="#6B21A8"/>
    </radialGradient>
  </defs>
  <!-- Violet mist aura -->
  <ellipse cx="80" cy="65" rx="60" ry="35" fill="url(#wormGlow)"/>
  <!-- Contact shadow -->
  <ellipse cx="80" cy="98" rx="55" ry="12" fill="#2E1065" opacity="0.45"/>
  <!-- Little cute feet -->
  <circle cx="35" cy="94" r="5" fill="#5B21B6"/>
  <circle cx="58" cy="96" r="5" fill="#5B21B6"/>
  <circle cx="82" cy="96" r="5" fill="#5B21B6"/>
  <circle cx="106" cy="94" r="5" fill="#5B21B6"/>
  <!-- Segment 5 (Tail end) -->
  <g transform="translate(32, 78)">
    <circle cx="0" cy="0" r="13" fill="url(#segmentG)"/>
    <text x="0" y="4" font-family="Baloo 2, sans-serif" font-weight="900" font-size="11" fill="#FFFFFF" text-anchor="middle">W</text>
  </g>
  <!-- Segment 4 -->
  <g transform="translate(54, 72)">
    <circle cx="0" cy="0" r="14.5" fill="url(#segmentG)"/>
    <text x="0" y="4.5" font-family="Baloo 2, sans-serif" font-weight="900" font-size="12" fill="#FFFFFF" text-anchor="middle">E</text>
  </g>
  <!-- Segment 3 -->
  <g transform="translate(78, 68)">
    <circle cx="0" cy="0" r="16" fill="url(#segmentG)"/>
    <text x="0" y="5" font-family="Baloo 2, sans-serif" font-weight="900" font-size="13" fill="#FFFFFF" text-anchor="middle">I</text>
  </g>
  <!-- Segment 2 -->
  <g transform="translate(104, 64)">
    <circle cx="0" cy="0" r="17.5" fill="url(#segmentG)"/>
    <text x="0" y="5.5" font-family="Baloo 2, sans-serif" font-weight="900" font-size="14" fill="#FFFFFF" text-anchor="middle">V</text>
  </g>
  <!-- Segment 1: Head (Cute chubby face) -->
  <g transform="translate(130, 56)">
    <circle cx="0" cy="0" r="19" fill="url(#headG)"/>
    <!-- Rosy cheek -->
    <ellipse cx="-4" cy="6" rx="4" ry="2.5" fill="#F472B6" opacity="0.6"/>
    <!-- Big anime eye -->
    <ellipse cx="6" cy="-2" rx="5.5" ry="7" fill="#0F172A"/>
    <ellipse cx="4.5" cy="-4" rx="2.5" ry="3.5" fill="#FFFFFF"/>
    <circle cx="8" cy="1" r="1.2" fill="#FFFFFF"/>
    <!-- Antenna 1 -->
    <path d="M-2 -18 Q-8 -30 -16 -32" stroke="#A855F7" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="-16" cy="-32" r="3.5" fill="#FDE047"/>
    <!-- Antenna 2 -->
    <path d="M6 -18 Q6 -32 2 -36" stroke="#C084FC" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="2" cy="-36" r="3.5" fill="#FDE047"/>
    <!-- Cute smile -->
    <path d="M4 8 Q8 12 11 8" stroke="#581C87" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  </g>
</svg>