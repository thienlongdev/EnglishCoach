<svg viewBox="0 0 320 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Celestial Dual Aura: Cyan Memory Sky + Warm Golden Wisdom -->
    <radialGradient id="ktAuraCyan" cx="160" cy="180" r="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ktAuraGold" cx="160" cy="140" r="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#F59E0B" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>

    <!-- Ancient Gnarled Bark Gradients -->
    <linearGradient id="ancientTrunkG" x1="160" y1="360" x2="160" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1F130B"/>
      <stop offset="25%" stop-color="#382314"/>
      <stop offset="60%" stop-color="#55351E"/>
      <stop offset="85%" stop-color="#73492A"/>
      <stop offset="100%" stop-color="#8C5B36"/>
    </linearGradient>
    <linearGradient id="barkHighlight" x1="120" y1="180" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A26C40" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#382314" stop-opacity="0"/>
    </linearGradient>

    <!-- Warm Golden Leaf Canopy Clusters (Signature Hero Palette) -->
    <radialGradient id="goldCanopyDeep" cx="35%" cy="30%" r="68%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="35%" stop-color="#F59E0B"/>
      <stop offset="75%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </radialGradient>
    <radialGradient id="goldCanopyBright" cx="32%" cy="28%" r="70%">
      <stop offset="0%" stop-color="#FEF9C3"/>
      <stop offset="28%" stop-color="#FDE047"/>
      <stop offset="65%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#B45309"/>
    </radialGradient>
    <radialGradient id="goldCanopyCrown" cx="30%" cy="25%" r="72%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="22%" stop-color="#FEF08A"/>
      <stop offset="58%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#D97706"/>
    </radialGradient>

    <!-- Cyan Glowing Memory Vein / Crystal Seed Glow -->
    <linearGradient id="cyanVein" x1="160" y1="340" x2="160" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="30%" stop-color="#00F0FF"/>
      <stop offset="70%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>
    <radialGradient id="seedGlow" cx="160" cy="316" r="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#38BDF8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Dual Ethereal Celestial Aura (Cyan + Gold) -->
  <circle cx="160" cy="170" r="145" fill="url(#ktAuraCyan)"/>
  <circle cx="160" cy="135" r="135" fill="url(#ktAuraGold)"/>

  <!-- Sacred Stone Mound & Mossy Root Plinth -->
  <ellipse cx="160" cy="352" rx="72" ry="22" fill="#1C1917" opacity="0.6"/>
  <ellipse cx="160" cy="346" rx="58" ry="17" fill="#292524" opacity="0.85"/>
  <!-- Ancient stepping stones surrounding roots -->
  <path d="M110 354 C98 348 104 338 118 342 C126 344 122 356 110 354 Z" fill="#57534E"/>
  <path d="M210 354 C222 348 216 338 202 342 C194 344 198 356 210 354 Z" fill="#57534E"/>

  <!-- Ancient Spiraling Root Buttresses Gripping the Plinth -->
  <path d="M150 310 Q125 330 96 348" stroke="#382314" stroke-width="13" stroke-linecap="round"/>
  <path d="M170 310 Q195 330 224 348" stroke="#2B1A0F" stroke-width="13" stroke-linecap="round"/>
  <path d="M160 290 Q152 328 156 354" stroke="#4A2F1B" stroke-width="11" stroke-linecap="round"/>
  <path d="M142 300 Q118 318 108 338" stroke="#55351E" stroke-width="8" stroke-linecap="round"/>
  <path d="M178 300 Q202 318 212 338" stroke="#3D2413" stroke-width="8" stroke-linecap="round"/>

  <!-- Majestic Spiraling Ancient Trunk (Rich twisting curves) -->
  <path d="M140 330 C134 270 114 228 92 176 C116 190 144 198 160 178 C176 198 204 190 228 176 C206 228 186 270 180 330 Z" fill="url(#ancientTrunkG)"/>
  <!-- Trunk 3D Chiaroscuro & Bark Ribs -->
  <path d="M140 330 C134 270 118 230 102 188 C118 196 142 200 152 182 C146 220 144 270 142 330 Z" fill="url(#barkHighlight)"/>
  <!-- Twisting Bark Grooves -->
  <path d="M138 316 Q130 264 120 220 Q114 198 104 186" stroke="#24140A" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M152 324 Q146 270 138 230 Q146 205 142 188" stroke="#24140A" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M168 324 Q174 270 182 230 Q174 205 178 188" stroke="#1F130B" stroke-width="2.8" stroke-linecap="round" fill="none"/>

  <!-- Major Ancient Branches Reaching Toward Sky -->
  <!-- Left Main Bough -->
  <path d="M118 204 Q78 178 52 144" stroke="#4A2F1B" stroke-width="12" stroke-linecap="round"/>
  <path d="M96 188 Q70 154 58 126" stroke="#3D2413" stroke-width="8" stroke-linecap="round"/>
  <!-- Right Main Bough -->
  <path d="M202 204 Q242 178 268 144" stroke="#3D2413" stroke-width="12" stroke-linecap="round"/>
  <path d="M224 188 Q250 154 262 126" stroke="#331E0F" stroke-width="8" stroke-linecap="round"/>
  <!-- Center Crown Spire -->
  <path d="M160 190 Q158 148 160 108" stroke="#55351E" stroke-width="14" stroke-linecap="round"/>

  <!-- Glowing Cyan Memory Veins & Runes Flowing up Trunk -->
  <path d="M154 328 Q144 280 150 240 Q158 214 150 184 Q142 160 128 146" stroke="url(#cyanVein)" stroke-width="3" stroke-linecap="round" opacity="0.95"/>
  <path d="M164 320 Q172 278 166 242 Q160 216 170 186 Q184 158 200 144" stroke="url(#cyanVein)" stroke-width="2.8" stroke-linecap="round" opacity="0.95"/>
  <!-- Branching capillary veins into limbs -->
  <path d="M150 240 Q130 220 106 196 Q88 178 72 164" stroke="url(#cyanVein)" stroke-width="2.2" stroke-linecap="round" opacity="0.88"/>
  <path d="M166 242 Q186 220 214 196 Q232 178 248 164" stroke="url(#cyanVein)" stroke-width="2.2" stroke-linecap="round" opacity="0.88"/>
  <path d="M156 198 Q158 162 160 124" stroke="url(#cyanVein)" stroke-width="2.4" stroke-linecap="round" opacity="0.9"/>

  <!-- Glowing Memory Nodes / Ancient Glyphs on Bark -->
  <circle cx="150" cy="240" r="4" fill="#00F0FF"/>
  <circle cx="150" cy="240" r="6" stroke="#E0F2FE" stroke-width="1.2" fill="none" opacity="0.8"/>
  <circle cx="166" cy="242" r="3.8" fill="#00F0FF"/>
  <circle cx="156" cy="198" r="4.2" fill="#67E8F9"/>
  <circle cx="106" cy="196" r="3.2" fill="#38BDF8"/>
  <circle cx="214" cy="196" r="3.2" fill="#38BDF8"/>

  <!-- Sacred Knowledge Seed Nestled Amidst the Root Fork -->
  <circle cx="160" cy="316" r="24" fill="url(#seedGlow)"/>
  <!-- Crystalline Seed Pod Body -->
  <path d="M160 300 C151 300 146 312 146 320 C146 328 153 334 160 334 C167 334 174 328 174 320 C174 312 169 300 160 300 Z" fill="url(#cyanVein)"/>
  <!-- Inner Golden Spark -->
  <circle cx="160" cy="318" r="4.5" fill="#FEF08A"/>
  <!-- Specular facets -->
  <path d="M154 308 L160 302 L166 308" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" opacity="0.9"/>

  <!-- Tier 1 Canopy (Back Layer: Deep Golden Amber Foliage) -->
  <circle cx="86" cy="156" r="50" fill="url(#goldCanopyDeep)"/>
  <circle cx="234" cy="156" r="50" fill="url(#goldCanopyDeep)"/>
  <circle cx="160" cy="116" r="58" fill="url(#goldCanopyDeep)"/>
  <circle cx="120" cy="138" r="52" fill="url(#goldCanopyDeep)"/>
  <circle cx="200" cy="138" r="52" fill="url(#goldCanopyDeep)"/>

  <!-- Tier 2 Canopy (Mid Layer: Warm Radiant Golden/Honey Clouds) -->
  <circle cx="68" cy="136" r="44" fill="url(#goldCanopyBright)"/>
  <circle cx="252" cy="136" r="44" fill="url(#goldCanopyBright)"/>
  <circle cx="106" cy="116" r="48" fill="url(#goldCanopyBright)"/>
  <circle cx="214" cy="116" r="48" fill="url(#goldCanopyBright)"/>
  <circle cx="160" cy="94" r="52" fill="url(#goldCanopyBright)"/>

  <!-- Tier 3 Canopy (Front & Top Crest: Luminous Golden Highlights) -->
  <circle cx="134" cy="98" r="42" fill="url(#goldCanopyCrown)"/>
  <circle cx="186" cy="98" r="42" fill="url(#goldCanopyCrown)"/>
  <circle cx="160" cy="74" r="46" fill="url(#goldCanopyCrown)"/>
  <circle cx="160" cy="54" r="32" fill="url(#goldCanopyCrown)"/>

  <!-- Delicate Golden Leaf Filigree & Shimmer Accents on Foliage -->
  <!-- Left Canopy Leaf Details -->
  <path d="M52 130 C44 122 50 114 62 120 C54 124 50 134 52 130 Z" fill="#FEF08A" opacity="0.9"/>
  <path d="M78 116 C70 108 76 100 88 106 C80 110 76 120 78 116 Z" fill="#FEF08A" opacity="0.9"/>
  <!-- Center Crest Highlights -->
  <path d="M146 54 C138 46 144 38 156 44 C148 48 144 58 146 54 Z" fill="#FFFFFF" opacity="0.95"/>
  <path d="M168 50 C160 42 166 34 178 40 C170 44 166 54 168 50 Z" fill="#FFFFFF" opacity="0.95"/>
  <!-- Right Canopy Leaf Details -->
  <path d="M268 130 C276 122 270 114 258 120 C266 124 270 134 268 130 Z" fill="#FEF08A" opacity="0.9"/>
  <path d="M242 116 C250 108 244 100 232 106 C240 110 244 120 242 116 Z" fill="#FEF08A" opacity="0.9"/>

  <!-- Glowing Starlight Spangles on the Canopy -->
  <circle cx="112" cy="88" r="2.5" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="208" cy="88" r="2.5" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="160" cy="42" r="3" fill="#FFFFFF" opacity="0.95"/>
  <circle cx="82" cy="142" r="2.2" fill="#FEF08A" opacity="0.85"/>
  <circle cx="238" cy="142" r="2.2" fill="#FEF08A" opacity="0.85"/>
</svg>