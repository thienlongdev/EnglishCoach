<svg viewBox="0 0 256 140" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="sacredGlow" cx="128" cy="70" r="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#F59E0B" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sacredBorder" x1="0" y1="0" x2="256" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="25%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="75%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#FEF08A"/>
    </linearGradient>
    <radialGradient id="soilMagical" cx="128" cy="70" r="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B264E"/>
      <stop offset="60%" stop-color="#241432"/>
      <stop offset="100%" stop-color="#150C1F"/>
    </radialGradient>
  </defs>
  <!-- Ambient Gold Halo -->
  <ellipse cx="128" cy="70" rx="120" ry="60" fill="url(#sacredGlow)"/>
  <!-- Base Soil Plot Diamond (256 x 128) -->
  <polygon points="128,6 252,68 128,130 4,68" fill="url(#soilMagical)"/>
  <!-- Gold Rune Outer Border -->
  <polygon points="128,6 252,68 128,130 4,68" stroke="url(#sacredBorder)" stroke-width="3.5" fill="none"/>
  <!-- Inner Inscribed Rune Diamond -->
  <polygon points="128,16 236,70 128,122 20,70" stroke="#FBBF24" stroke-width="1.8" stroke-dasharray="8 4" fill="none" opacity="0.8"/>
  <!-- Corner Celestial Rune Seals -->
  <!-- Top Node -->
  <circle cx="128" cy="16" r="4.5" fill="#FEF08A"/>
  <circle cx="128" cy="16" r="7" stroke="#F59E0B" stroke-width="1" fill="none"/>
  <!-- Right Node -->
  <circle cx="236" cy="70" r="4.5" fill="#FEF08A"/>
  <circle cx="236" cy="70" r="7" stroke="#F59E0B" stroke-width="1" fill="none"/>
  <!-- Bottom Node -->
  <circle cx="128" cy="122" r="4.5" fill="#FEF08A"/>
  <circle cx="128" cy="122" r="7" stroke="#F59E0B" stroke-width="1" fill="none"/>
  <!-- Left Node -->
  <circle cx="20" cy="70" r="4.5" fill="#FEF08A"/>
  <circle cx="20" cy="70" r="7" stroke="#F59E0B" stroke-width="1" fill="none"/>
  <!-- Central Glowing Glyph -->
  <path d="M128 52 L140 70 L128 88 L116 70 Z" stroke="#FEF08A" stroke-width="1.5" fill="#F59E0B" fill-opacity="0.3"/>
  <circle cx="128" cy="70" r="3" fill="#FFFFFF"/>
</svg>