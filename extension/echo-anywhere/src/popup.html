<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Echo Anywhere</title>
  <link rel="stylesheet" href="ui.css">
  <style>
    body { width: 340px; }
    header { padding: 14px; }
    main { padding: 12px; }
    .acct { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .acct .chip { background: rgba(255,255,255,.14); color: #fff; }
    .acct .chip.gold { background: rgba(251,191,36,.25); color: #fde68a; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .link { background: none; border: 0; padding: 0; color: var(--sea); font-weight: 700; font-size: 12.5px; }
  </style>
</head>
<body>
  <header class="hero">
    <div class="brand"><img src="icons/echo-128.webp" alt=""><div><b>Echo Anywhere</b><small>English Coach trên mọi trang web</small></div></div>
    <div class="acct" id="acct" aria-live="polite"></div>
  </header>
  <main class="stack" id="main"></main>
  <script type="module" src="popup.js"></script>
</body>
</html>
