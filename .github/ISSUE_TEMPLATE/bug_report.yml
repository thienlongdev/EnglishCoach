name: Bug Report
description: Report a reproducible defect in English Coach
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the unexpected behavior clearly.
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Affected Subsystem
      options:
        - Backend (Spring Boot)
        - Frontend (Next.js / UI / 3D)
        - AI Service (FastAPI / Voice / Pronunciation)
        - Browser Extension (Echo Anywhere)
        - Infrastructure / CI
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Navigate to ...
        2. Trigger ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
