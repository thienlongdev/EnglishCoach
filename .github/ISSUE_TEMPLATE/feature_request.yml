name: Feature Request
description: Propose a new capability or architectural improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What learner or engineering need does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe the expected UX, API contract, or architectural boundary.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Acceptance & Verification Criteria
      description: How should this change be tested and verified?
    validations:
      required: false
