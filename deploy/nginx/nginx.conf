# English Coach production edge — main configuration (mounted read-only over the image's /etc/nginx/nginx.conf).
# The site itself lives in conf.d/default.conf (deploy/nginx/default.conf). This file only sizes the worker processes.
#
# Why it exists (capacity test 2026-10, docs/performance/capacity-2026-10/): the image's own file allows 1,024
# connections per worker. Every proxied request and every WebSocket holds TWO connections (browser side + upstream
# side), so two workers topped out near 1,000 open browser connections — fewer than the open WebSockets of a few
# hundred learners plus their page and API connections. 4,096 per worker with a matching descriptor limit costs a few
# KiB of memory per connection actually open, nothing for unused slots.

user  nginx;
worker_processes  auto;
worker_rlimit_nofile  16384;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

events {
    worker_connections  4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # The site's own access log format (no query strings) is set per server in default.conf.
    access_log  off;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;

    # idle browser keep-alive connections are released after 30 s (each holds TLS state in this 160 MB container)
    keepalive_timeout  30;
    keepalive_requests 1000;

    # Spool files on DISK (the nginx_spool volume of docker-compose.prod.yml), never in the container's RAM: a request
    # body above 16 KiB and a proxied response that overflows its memory buffers are written here. They used to go to the
    # 8 MiB tmpfs at /var/cache/nginx, so one 8 MB upload, or two 5 MB ones at the same time, filled it and the upload
    # was answered 500 ("No space left on device") before the backend saw it; a bigger tmpfs would count against the
    # container's 160 MB memory limit. Nginx unlinks each spool file as soon as it is created, so nothing outlives its
    # request (an interrupted upload included). Bounds: client_max_body_size (default.conf) and the large-body
    # connection limit there.
    client_body_temp_path /var/spool/nginx/client_body 1 2;
    proxy_temp_path       /var/spool/nginx/proxy 1 2;

    include /etc/nginx/conf.d/*.conf;
}
