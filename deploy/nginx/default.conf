# Cloudflare production edge: only verified proxy peers may supply the visitor address.
# X-Real-IP and X-Forwarded-For below are overwritten with that verified $remote_addr.
# Origin restriction and recovery: docs/performance/capacity-2026-10/CDN-ORIGIN-RUNBOOK.md.
include /etc/nginx/cloudflare-realip.conf;

# Version of the server is nobody's business.
server_tokens off;

# Access log without query strings and without the Referer: page and media URLs carry one-time tokens in their
# query (password reset, e-mail verification, media grants) and those must not rest in a log file.
log_format ec_access '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status '
                     '$body_bytes_sent "$http_user_agent" rt=$request_time';

# Desk app frames use first-party page paths. Keep the explicit TLS port in staging.
map $http_host $desk_app_origin {
    default https://englishcoach.io.vn;
    "~^englishcoach\.io\.vn:[0-9]{1,5}$" https://$http_host;
}

# Map for WebSocket connection upgrade (empty string preserves HTTP/1.1 upstream keepalive pools!)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      "";
}

# Fail-closed API Cache-Control allowlist: only explicit private browser-cache policies from upstream pass through;
# empty, error, or public policies always fail closed to no-store (never caches cookie-bearing API responses at CDN).
map $upstream_http_cache_control $api_cache_control {
    default "no-store, no-cache, must-revalidate, proxy-revalidate";
    "~^private,\s*max-age=[0-9]{1,4}(?:,\s*(?:must-revalidate|stale-while-revalidate=[0-9]{1,4}))?$" $upstream_http_cache_control;
    "~^private,\s*no-store$" "private, no-store";
}

# Public files (/assets/, static file names): one Cache-Control from the edge. A file that exists is cached for a year
# (a changed public file ships under a new name); anything else (404 during a release, a redirect) is never stored.
map $upstream_status $static_asset_cache_control {
    default "no-store";
    ~^(?:200|206|304)$ "public, max-age=31536000, immutable";
}

# Exams: edge limit for the public practice-scopes read (anonymous, loads a full content tree per call).
# Only that path gets a key; an empty key is never counted, so every other /api/ request is unaffected.
map $request_uri $exams_practice_scopes_key {
    default "";
    ~^/api/v1/exams/forms/[^/?]+/practice-scopes(?:\?|$) $binary_remote_addr;
}
limit_req_zone $exams_practice_scopes_key zone=exams_practice_scopes:1m rate=30r/m;

# Anonymous account actions that each cost a database write and, for some, an outgoing e-mail. Only these paths get a
# key (per client address); session refresh, /auth/me and every signed-in call are never counted here. The backend
# keeps its own, stricter per-address and per-account throttles; this one only stops a flood before it reaches Java.
map $request_uri $auth_action_key {
    default "";
    ~^/api/v1/auth/(?:login|register|forgot-password|reset-password|resend-verification|verify-email|google/exchange|google/link)(?:\?|$) $binary_remote_addr;
}
limit_req_zone $auth_action_key zone=auth_actions:1m rate=3r/s;

# The three anonymous lookup proxies served by the frontend (/api/translate, /api/tts, /api/dictionary). One word
# click makes up to three calls; a classroom behind one address stays far below this, a scraper does not.
limit_req_zone $binary_remote_addr zone=public_proxy:1m rate=10r/s;

# Anki package uploads are the only large request bodies: at most two at a time on the whole site, one per address.
limit_conn_zone $server_name zone=apkg_site:64k;
limit_conn_zone $binary_remote_addr zone=apkg_addr:1m;

# Large request bodies (8 MB and more: long speaking recordings, community videos) at the same time on the whole site.
# Every request body above 16 KiB is spooled on disk (nginx.conf) before the backend sees it; this bounds that spool to
# 16 x 40 MB. Smaller bodies and requests without a body get no key and are never counted; site-wide, never per address
# (a classroom shares one address).
map $content_length $large_body_site {
    default "";
    "~^[89][0-9]{6}$" $server_name;
    "~^[0-9]{8,}$" $server_name;
}
limit_conn_zone $large_body_site zone=large_body_site:64k;

# Open WebSockets per address. A learner keeps one per tab; a classroom behind one address stays far below this. Each
# socket holds backend memory for hours, so one address must not be able to open thousands.
limit_conn_zone $binary_remote_addr zone=ws_addr:1m;

# Upstream definitions using Docker service DNS names
upstream frontend_upstream {
    server frontend:3000;
    keepalive 32;
}

upstream backend_upstream {
    server backend:8080;
    keepalive 32;
}

# HTTP server - Port 80
server {
    listen 80;
    listen [::]:80;
    server_name englishcoach.io.vn www.englishcoach.io.vn;

    access_log /var/log/nginx/access.log ec_access;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://englishcoach.io.vn$request_uri;
    }
}

# HTTPS server - Port 443, matching the live production configuration.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name englishcoach.io.vn www.englishcoach.io.vn;

    access_log /var/log/nginx/access.log ec_access;

    ssl_certificate     /etc/letsencrypt/live/englishcoach.io.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/englishcoach.io.vn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    # Forward-secret AEAD suites only (TLS 1.3 suites are not governed by this list).
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # 4 KiB TLS records instead of 16 KiB: a quarter of the write buffer per open connection (capacity test 2026-10:
    # the edge ran out of memory holding thousands of keep-alive and WebSocket connections) and an earlier first byte.
    ssl_buffer_size 4k;

    # Request bodies: the largest ordinary upload is a 30 MB community video (speaking audio 25 MB, documents 6 MB).
    # Only the Anki package import below may send more. Bodies are spooled on disk (nginx.conf), never in RAM.
    client_max_body_size 40m;
    client_header_timeout 20s;
    client_body_timeout   60s;
    proxy_connect_timeout 60s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;
    send_timeout          120s;

    # Security headers on every response of this server, including error answers and the locations that add their
    # own Cache-Control (add_header_inherit keeps both).
    add_header_inherit merge;
    # 30 days to begin with; this host only (no includeSubDomains, no preload) until every subdomain is known.
    add_header Strict-Transport-Security "max-age=2592000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # The site records speech; it uses no camera, location, payment handler or USB device.
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=(), payment=(), usb=()" always;
    # A window this site opens keeps no handle on it, and a page that opened this site gets none either.
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    # Enforced, policy 1 of 2 (origins): where this site may load code, styles, fonts and frames from, where its
    # scripts may connect and submit forms to, and who may frame it. Every origin below is one the application uses
    # (Turnstile, the YouTube player, the Material Symbols font, the two lookup services the reader calls from the
    # browser); adding a third-party origin to the application means adding it here in the same change. Images and
    # media stay open to any HTTPS host: lesson thumbnails and audio come from the learner's own sources.
    # Policy 2 of 2 (scripts) is sent by the frontend with every page (frontend/src/proxy.ts): a per-request nonce with
    # 'strict-dynamic'. A browser enforces BOTH, so a script runs only if it carries the page's nonce (or was loaded by
    # one that does) AND comes from an origin listed here. 'unsafe-inline' below therefore admits nothing on its own:
    # it only stops this host list from refusing the framework's nonce-carrying inline scripts. No eval anywhere
    # (the game renderer uses Pixi's eval-free build). Violations are reported to /api/csp-report.
    # The room's computer loads the canonical learning pages and their lessons.
    set $desk_pages "$desk_app_origin/reading $desk_app_origin/flashcards $desk_app_origin/writing $desk_app_origin/listening $desk_app_origin/listening/ $desk_app_origin/speaking $desk_app_origin/speaking/ $desk_app_origin/grammar $desk_app_origin/grammar/ $desk_app_origin/learning-path $desk_app_origin/progress $desk_app_origin/exams $desk_app_origin/exams/ $desk_app_origin/games $desk_app_origin/games/ $desk_app_origin/community $desk_app_origin/community/";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com https://www.youtube.com https://s.ytimg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; media-src 'self' data: blob: https:; connect-src 'self' data: blob: wss://englishcoach.io.vn https://*.livekit.cloud wss://*.livekit.cloud https://translate.googleapis.com https://api.datamuse.com https://challenges.cloudflare.com; frame-src $desk_pages https://challenges.cloudflare.com https://www.youtube.com https://www.youtube-nocookie.com https://sketchfab.com; worker-src 'self' blob:; manifest-src 'self'; form-action 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests; report-uri /api/csp-report" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/atom+xml application/wasm image/svg+xml model/gltf-binary;
    gzip_min_length 1000;

    # Redirect www to non-www.
    if ($host = www.englishcoach.io.vn) {
        return 301 https://englishcoach.io.vn$request_uri;
    }

    # Hidden files and directories (.env, .git, ...) are never served; /.well-known/ stays available.
    location ~ /\.(?!well-known/) {
        return 404;
    }

    # Static Asset Caching - Next.js compiled static chunks & build assets
    location /_next/static/ {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Content-hashed Cosmos lexicon JSON (verified hashed 12-hex name by test-cosmos.mjs)
    location ~ ^/cosmos/lexicon-[0-9a-f]{12}\.json$ {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header Cache-Control;
        add_header Cache-Control $static_asset_cache_control always;
    }

    # Static Asset Caching - Public assets, SVG mascots, models, fonts, images
    # The frontend sends "public, max-age=0" for public files; the edge sends the one Cache-Control (map above).
    location /assets/ {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header Cache-Control;
        add_header Cache-Control $static_asset_cache_control always;
    }

    # Listening free on-device translator (2026-10-29): module worker, pinned runtime (Transformers.js 3.8.1 / ONNX Runtime
    # Web) and pinned OPUS-MT en->vi weights, all same-origin under versioned names (MANIFEST.sha256). A dedicated worker is
    # governed by the CSP of its OWN script response, so only these responses carry a policy that allows WebAssembly
    # compilation ('wasm-unsafe-eval', which never allows JS eval) and nothing but same-origin fetches; every page keeps the
    # site policy above. add_header_inherit off: two policies would both be enforced, so the site policy is not merged in
    # here and the other security headers are repeated. Weights end in .bin so the CDN caches them by extension.
    location ^~ /vendor/listening-translator/ {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header Cache-Control;
        add_header_inherit off;
        add_header Strict-Transport-Security "max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cache-Control $static_asset_cache_control always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; report-uri /api/csp-report" always;
    }

    # Study room physics (owner-authorized 2026-11-06): one classic worker that compiles exactly the pinned Rapier 0.12.0 WebAssembly
    # bytes (SHA-256 checked inside it) and hands the compiled module back; the page only instantiates it. Same narrow policy as the
    # translator: this response may compile WebAssembly and fetch nothing; every page keeps the site policy above.
    location ^~ /vendor/study-physics/ {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header Cache-Control;
        add_header_inherit off;
        add_header Strict-Transport-Security "max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cache-Control $static_asset_cache_control always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; report-uri /api/csp-report" always;
    }

    # Static Asset Caching - Common image, font, media formats & SVG mascot
    location ~* \.(?:ico|png|jpg|jpeg|gif|svg|webp|woff|woff2|ttf|eot|glb|mp3|wav|ogg)$ {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header Cache-Control;
        add_header Cache-Control $static_asset_cache_control always;
    }

    # NextAuth.js
    location ^~ /api/auth/ {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
    }

    # Content-Security-Policy violation reports: a small, bounded log sink in the frontend (never stored).
    location = /api/csp-report {
        limit_req zone=public_proxy burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        add_header Cache-Control "no-store";
    }

    # Development / QA pages are not part of the live site (the production build also answers 404 for them).
    location ^~ /speaking/shadowing/dev/ { return 404; }
    location = /landing-preview { return 404; }

    location = /api/translate {
        limit_req zone=public_proxy burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
    }

    location = /api/tts {
        limit_req zone=public_proxy burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
    }

    location = /api/dictionary {
        limit_req zone=public_proxy burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
    }

    # WebSocket endpoint (STOMP) of every realtime feature. The backend also registers /ws, which no client uses and
    # which is deliberately not routed here.
    location /ws-card-blast {
        limit_conn ws_addr 100;
        limit_conn_status 429;
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Test-User "";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Spring Boot backend - Community media direct route (prevents regex interception and Next.js proxy buffering)
    location ^~ /api/v1/community/media/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Test-User "";
        proxy_buffering off;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Echo AI Server-Sent Events stream: must stay unbuffered for low-latency token streaming.
    location = /api/v1/ai/chat/stream {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Test-User "";
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
    }

    # Backend range/media streaming endpoints (exam recordings/assets, listening/speaking audio, TTS): keep unbuffered.
    location ~ ^/api/v1/(?:exams/media|listening/audio|speaking/audio|tts)/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Test-User "";
        proxy_buffering off;
        proxy_hide_header Cache-Control;
        add_header Cache-Control $api_cache_control always;
    }

    # Anki package import: the one large upload. Streamed to the backend (not spooled here first), bounded in number.
    location = /api/v1/flashcards/upload-apkg {
        client_max_body_size 500m;
        limit_conn apkg_site 2;
        limit_conn apkg_addr 1;
        limit_conn_status 429;
        proxy_request_buffering off;
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Test-User "";
        proxy_buffering off;
        proxy_send_timeout 300s;
        proxy_read_timeout 600s;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
    }

    # The backend endpoints that hand out an application token or a session grant are called by the frontend's
    # server code over the container network (NextAuth sign-in, the Google exchange and link, /api/auth/refresh),
    # never by a browser. None is offered here; the backend additionally demands the frontend server's single-use,
    # body-bound signature on each of them (InternalServiceAuthFilter) and has no unsigned window in production.
    location = /api/v1/auth/login { default_type application/json; return 404 '{"code":"NOT_FOUND"}'; }
    location = /api/v1/auth/refresh { default_type application/json; return 404 '{"code":"NOT_FOUND"}'; }
    location = /api/v1/auth/session/refresh { default_type application/json; return 404 '{"code":"NOT_FOUND"}'; }
    location = /api/v1/auth/session/exchange { default_type application/json; return 404 '{"code":"NOT_FOUND"}'; }
    location = /api/v1/auth/google/exchange { default_type application/json; return 404 '{"code":"NOT_FOUND"}'; }
    location = /api/v1/auth/google/link { default_type application/json; return 404 '{"code":"NOT_FOUND"}'; }

    # Spring Boot backend (all other /api/ endpoints, skips regex search)
    location ^~ /api/ {
        limit_req zone=exams_practice_scopes burst=30 nodelay;
        limit_req zone=auth_actions burst=30 nodelay;
        limit_req_status 429;
        limit_conn large_body_site 16;
        limit_conn_status 503;
        # This edge's own refusals of an upload answer JSON the app can show (a backend answer is never replaced:
        # proxy_intercept_errors stays off).
        error_page 413 = @api_body_too_large;
        error_page 503 = @api_uploads_busy;
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # A development-only identity header must never reach the backend from the internet.
        proxy_set_header X-Test-User "";
        # Buffer ordinary JSON API responses so slow mobile clients release Tomcat threads immediately.
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
        proxy_hide_header Cache-Control;
        add_header Cache-Control $api_cache_control always;
    }

    location @api_body_too_large {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 413 '{"code":"PAYLOAD_TOO_LARGE","message":"Tệp quá lớn để tải lên (tối đa 40 MB)."}';
    }

    location @api_uploads_busy {
        default_type application/json;
        add_header Retry-After "30" always;
        add_header Cache-Control "no-store" always;
        return 503 '{"code":"UPLOADS_BUSY","message":"Hệ thống đang nhận nhiều tệp lớn. Vui lòng thử lại sau ít phút."}';
    }

    # Frontend
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # Only when the frontend itself cannot be reached (a restart): a small page instead of a bare gateway error.
        # API and webhook locations above keep their own error answers.
        error_page 502 504 = @frontend_unavailable;
    }

    location @frontend_unavailable {
        default_type text/html;
        add_header Retry-After "30" always;
        add_header Cache-Control "no-store" always;
        return 503 '<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="30"><title>English Coach</title><style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f0f9ff;color:#0f172a;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;text-align:center}main{max-width:28rem;padding:2rem}h1{font-size:1.4rem;margin:0 0 .75rem}p{margin:.4rem 0;line-height:1.5;color:#334155}</style></head><body><main><h1>English Coach đang được cập nhật</h1><p>Trang sẽ hoạt động trở lại sau ít phút. Bài học và tiến độ của bạn vẫn được giữ nguyên.</p><p>English Coach is being updated and will be back in a few minutes. Your lessons and progress are safe.</p></main></body></html>';
    }
}
