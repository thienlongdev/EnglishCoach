# Production include. Activate ONLY after englishcoach.io.vn is proxied by Cloudflare (orange cloud) and the origin
# accepts ports 80/443 from Cloudflare only (deploy/ops/ec-origin-allowlist.sh). Runbook:
# docs/performance/capacity-2026-10/CDN-ORIGIN-RUNBOOK.md.
#
# With this file included at http level, $remote_addr becomes the visitor's address taken from CF-Connecting-IP, but
# ONLY for connections whose peer is one of Cloudflare's published ranges below. A connection from anywhere else keeps
# its own peer address and its CF-Connecting-IP is ignored, so a caller can never choose its address by sending the
# header. The existing site file then forwards that address unchanged (X-Real-IP / X-Forwarded-For are overwritten
# with $remote_addr), the backend keeps reading it through ClientIpResolver, and every per-address limit keeps working.
#
# Ranges: https://www.cloudflare.com/ips-v4 and /ips-v6, fetched 2026-10-14. Re-check them when activating and at
# least every quarter; a missing range only means that visitor is limited as the Cloudflare address, never a bypass.

set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

real_ip_header CF-Connecting-IP;
# one hop only: the address Cloudflare saw, never a value from the visitor's own X-Forwarded-For
real_ip_recursive off;
